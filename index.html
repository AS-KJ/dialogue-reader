  {"type": "line", "who": "Luana", "k": "guest", "text": "Well, I think that the main difference with, and before getting to the main difference, I prefer the EBITDA multiple versus the PE and that the reason being, I think the EBITDA tells more about a company than the earnings and the EBITDA is really what the company is generating in the core of its business. And it's easier for someone to compare companies in that sense, because then you are not getting to what is the tax rates this company is paying."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "What is the leverage that this company is paying? Let's say if a company holds debt in their balance sheets, they will have to pay interest in this debt and that's going to be below EBITDA and will be removed before you get to a company's earnings."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "You see like whenever you're comparing, let's say it's a very high leverage company and this company is say in the US versus there is a company in Brazil with zero debt and it's paying taxes in Brazil. If you're using PE, you cannot really do a comparison of value since you're dealing with other variables. There are different intrinsically difference. But when you look at a company, you're looking at operationally, the core of its business, how this company is performing. And then yes, then the company has so many ways of growing or managing their taxes that you can of course look at the PE too, but the EBITDA will make it easier to make comparisons amongst the company because then you're really talking about, okay, operational versus operations."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "A PE ratio, is that based on the E in EBITDA, just the earnings?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Or is it a little more complicated than that?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, then it's just earnings. Then the E, the other way you can read that it's the net income of a company. So PE ratio is always based on the net income."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Income, yes."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "EBITDA, sorry, yeah. Then EBITDA, you were talking about this E, the earnings before interest, before taxes before depreciation and amortization."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I wonder if Saudi Aramco depreciates their lions and tigers, by the way. You wonder about that. It gets complicated once you get into EBITDA because there's so many things you can... You look at interest, like you mentioned, you look at taxes, you look at depreciation, you look at amortization, private equity groups, they start looking at CapEx. Private companies, you start looking at. perks and you start adding in the perks. So as simple as we want to make this sound, it's sometimes a little bit more complicated. What information are you looking at? So how helpful is the annual report? 10 Ks, 8 Ks financial statements. Are you looking at all of the above or is some of this stuff juicier than some of the other information?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, all of the information above is extremely important because you will have one thing is to forecast where a company is going without having any basis. But once you have their actuals and that's where from a 10 K and a 10 Q, from a 10 K and 10 Q will you have the actuals of."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Let's define those for those who don't know. 10 K is the annual, right?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes. Yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "10 Q is quarterly. And what about the-"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "That's exactly right."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And the 8K is when the public traded company issues a press release. So not necessarily needs to gear towards EBITDA or net income. It can be, for example, a changing management than a company. And since it's a material information, they have to issue this information to the markets. So whenever something material happens with the company, they issue an 8K, which will also..."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Like an acquisition?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Like an extension. Yes. Then an 8K would be issued."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Free cash flow."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Free cash flow. Very, very important. And I would encourage all the private companies to, if they are not doing this yet and only looking at multiples, I would definitely encourage them to start building their financial model, especially because they will be the best ones to have a sense on where this company is going."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And let's say, if I own a private company and I'm selling, let's make this very simple. I'm selling chairs and each chair that I'm making, I'm going to sell for a hundred dollars and it's costing me $50. So I know my gross margin here is $50 per chair. Then it will really come down to how many chairs do I want to produce per year? How many chairs?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Do I think I can produce in 10 years? Should I buy a new technology that will increase this production? And only with these informations, you will be able to actually build your cashflow forecast and have a better sense of how much your business value, because multiple can give you a range of where the company is, but you are. It's more of a rule of thumb, but then actually getting to the nitty gritty of your own business. And then as you were saying about the free cash flow, that's on a very high level, you can say that this is almost, you're very close to the discounted cash flow. And in the free cash flow, you have everything that you're generating from operational sites minus everything that you had to invest in the business to generate that operating cash flow."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So let's actually back up and can you walk us through slowly how to calculate free cash flow? Is that FCS in the mouse?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, absolutely. So for the first, a cash flow statement, going back a little bit, cash flow statements encompasses three cash flows, three main categories of cash flows. The first one, the cash flow from operations. The second one, cash flows from investing. The third one, cash flows from financing. Now let's go back to the first one. Cash flow from operations. That's where all the cash that your business has generated from operation standpoint. So let's go back to my own business here. And I'm a chair manufacturer. If I sold 10 chairs and my gross margin is $50, it's the $100 minus 50."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Talking about $50. So let's make this simple. I sold 10. I'm saying that's my cash flow from operations in this year was $500. That would be more details. There would be more nuances. Another very important portion of this operations, it's not only the margin that you are making out of the product you're selling, but also your working capital management. So how much days you are receiving this money, how much days you're actually having to pay your suppliers and your inventory, but that can get a little bit more complicated. We can talk about that later. In a nutshell, operations is how much the business of selling a product has generated for me. Then you go to investing. Any business..."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Let's actually pause before we go into that. What Luana is talking about here is some business owners might not know this because they don't prepare a cash flow statement. So a cash flow statement is one of the three financial statements. I know you find that very hard to believe, Luana, probably, but we see a ton of business owners in the lower middle market that do not look at their cash flow statement, believe it or not. So they look at their P&L and balance sheet regularly, but very rarely look at the cash flow statement. So on that cash flow statement, that's actually broken down into the cash flow from operations, investing and financing. So now you're going to go, Luana, into the investing portion of that, which you can go ahead."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Sure. Absolutely. So going back to the investing for any business to be able to generate cash from its own operations, some investing will go behind that business. In investing, you will divide this between main two brackets. You have your maintenance investments, which is the investments you have to make for the business to stay afloat. And you have your growth investments, which is you don't need to make this investment, but let's say if you plan to buy a new equipment that will help you to gain efficiency in your operations, we call this the growth investment. This is so. And going back to our chairs here, let's say to keep my current equipment working well, I have to do some maintenance. I have to do maintenance in the textile of the chairs, et cetera. And to keep my business, let's say I spent a hundred dollars to just maintain. I'm not increasing my production. I'm just maintaining that my hundred dollars. So, and let's say if I didn't have any, I didn't expend anything in growing the business. If you remember, we had our cashflow of operations at 500, 10 chairs at gross margin of 50, 500. And I invested in one year, $100. My free cashflow, because free cashflow will not set considering the financing cashflow, will only consider cashflow from operations and cashflow from investing. My free cashflow is this 500 minus 100, which means my free cash flow was 400."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What do you use free cash flow for, by the way? Well, is that used in discounted cash flow?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, you use, I need to just emphasize here that there are a lot of more details behind it, but the high level figures, the high level, how we calculating is this. There would be like some other categories within each of these cash flows."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I somehow don't doubt you."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, so with the free cash flow, that's when you actually start looking at your DCF. The DCF will be the discounted cash flow. But first, before you discount it to present value, this will only happen at the end. In the beginning, you were really just worried on trying to understand. In year one, I was able to generate $400 of free cash flow. In year two, let's say everything stays the same."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "$400 year three, year four. Let's say this is a business that I will keep this investment and I will be able to generate $400 each year. All right. Now, now that I have this free cash flow, this is already gives me a lot of sense of it. And just the fact that this is positive, it means that my operations are covering my investments. So I actually have a leeway here."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "If I want to start growing the business to make an investment, to maybe buy a new equipment, and maybe this equipment will not be able to start enhancing my production in one year, but say if I spend $200 and next year I will be able to duplicate production. So this already starts giving you a lot of clues of how healthy is my business, the operations."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So the first step is calculating the cash flow, if you will, and then applying the different methods. So what other measures of cash flow do you use? Earnings, EBITDA, free cash flow. Are there any other methods that you use?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah. So you can start your cash flow from operations. You always start from operations. That's kind of the road map that we have. And you can start both from net income and from net income, go back to and make the adjustments necessary. Or if you want to start from EBITDA, you will get to the same place. So it don't matter which one you pick to start this operations calculation, you will get to the same number. Then you're going to get from your investments, you'll get from potentially from your accounting team, how much capital expenditure, which for short, and we call capex you spend in a year. And then you have this free cash flow. The free cash flow."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Is there a, do you call it EBITDA minus capex or is there a?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, for the free cash flow, can do like in a high, let's say if you're kind of just trying to get a sense of the business and not necessarily the correct amount of free cash flow, you can do EBITDA minus capex. And the reason you can do that is because EBITDA is one, if not the best, one of the best operational metrics that we have. It's really looking at operations so it can be a good, easy substitute of the cashflow from operations. So some companies will look at that EBITDA, but that is when you kind of need a number in a second or you don't need to have to go in a deep dive of that company. But to calculate cash flow from operations, you will start on this EBITDA, but you will have to make some adjustments there because you will have to make some tax adjustments since you pay taxes and this is not including the EBITDA. So let's say pay 30% of taxes you have to discount from this EBITDA and you're working cash management will also have to be discounted. Let's say you were receiving money from your payments terms. You were receiving money in 30 days, but if you have to pay your suppliers in 15 days, you kind of are 15 days short here in working capital because you're receiving 15 days later that you paid your supplies. So that will also be a formula to be considered in your cash flow statement, your operating cashflow."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I'm sure everyone's heads are spinning now. Let's actually back up for a moment. Who's your customer as an equity research analyst? Is it the investors or the public companies?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, it's investors. So usually our hedge funds, usually our asset managers, these are our main customers."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Now, let me put you on the spot here. This might make you uncomfortable. And I'm sure you've heard this before."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I don't know what the number is, but I know there's more buys than sells."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And what is your typical response to that?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Chinese walls."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Okay, let's go into this. This can be an uncomfortable topic, but for the industry overall. And why is that? Why we actually have more buys than sell?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "There are a lot of formulated answers for that."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I want to believe that all the ratings that equity analysts are giving to a company are because they truly believe that a company is undervalued or overvalued. But there are discussions."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "For one second, so a buy, what does a buy mean?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "A buy is, it's in other words, the company is undervalued. So the company is not traded where it should be. That's currently."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Currently."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Currently, yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "At that moment in time. Okay, got it."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, that's when you recommend to buy the stock. So let's say if I think, that Apple, it's undervalued, which is not the case this year. I think tech companies, I don't know, they have had their very bullish momentum. But let's say a company that everybody knows, Apple."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "If you think that Apple stocks should be closer to 600 after performing your own assessments of the future cash flows, and this is the company, I think they're trading at, I don't know where they're trading now, but then you issue a buy. And that reports that I'm talking about, when you issue a buy, you are actually writing entire reports and justifying your rating. And that reports will go to all the bank customers."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Oh, that's a really good point. I mean, that's a good point because it's not just the buyer, the seller. It's what's behind that. I would imagine reading the entire report. How long is a report and how often do those come out for each stock?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "So each stock usually every time that a company announced earnings, an equity analyst will issue a report and then each time a company issues an 8K news release that we think can bring a change in the valuation perspective, or we think it's important to let our customers know that, hey, this is a big deal. No, this is not a big deal. We also can issue a report. So we will very much depend on that."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "If the company has announced something to the market, usually that's when equity analysts follow up with the assessments of the news."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "When do they announce the earnings? What dates?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, the dates will fluctuate, but it's usually around March. Then we have earnings in May, earnings again in August and then November."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Is it the exact same date?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, no, no, no. Thank goodness not because remember I was covering around 15, 20 companies. If all of them issue their earnings on the same day, that would have been impossible for me to. So what we do when a company issue earnings, you have to get the reports, update your model. So let's say it was the, they are announcing the second quarter of 2021."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I have to open my financial model, look at, oh, I thought the company were to generate $200 million in revenue. And that was my estimate. But now I'm going to go there and type the actual. The actual was $120 million. And you start typing all the actuals up for the income statements, for the balance sheet, for the cashflow. And then you see, you start really getting to the analytical side of equity research, which I absolutely adore. It's like, wow."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I was expecting $200 million and it came 120. What is going on? Should I change my forecasting for the next years? Is this a one-off, something really unexpected happened? That's when you start really having that problem solving critical thinking into your evaluation. And then you're to explain this in your research reports."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "All the earnings, do those come out within the 30 day period of time?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "In other words, most companies earnings are they announced within the month of March and so on?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Within a few weeks of each other?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And usually companies of the same sector, for some reason that I actually don't know why, they usually report very close to each other. So in a week, you can have like two earnings per day. They're going to be kind of around. Exxon and Chevron, I don't know if it's still the same because I'm not covering them anymore for a while, but they used to report on the same day, all quarters."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Yeah. Maybe. Don't you think they all want to lay down their cards at the same time?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Exactly."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So the other companies don't adapt and then change their wording. That's the 10Q, correct?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "The 10Q for a quarter."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "When they announce the earnings?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Earnings is the 10Q. In March, it's the 10K when they announce the fourth quarter, then it's the annual."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Then it's the fourth quarter along with the annual."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And then annual report is typically what, a hundred-"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, it can be a hundred pages. We don't go through all the pages. That would be very hard for us. We are being very pressured by time. We want to get the best assessment that we can to our customers and to our traders."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Usually, let's say a company reported at 6 a.m. in the morning before the market opens."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What's your turnaround time?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "We talk to the traders, our first impressions. And this is really high level. We call it the trading desk. So traders can be aware of the sentiment of that report. And then we start updating the model. And that can take around like one hour because it's not only updating for the actual numbers. It's also getting to the assessment of, I need to make any changes to my forecasts for everything else I had in this model, given all this information the company just shared with me. So it can be a one to two hours process."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I was thinking weeks."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, the goal is on the same day they report, you will have an updated financial model and reports issued to the market. In some cases, if it's something really crazy happened and let's say the company just announced in that 10Q that they are merging or they just bought a new asset, that will kind of make the financial model more complicated. You have to add a new perspective that you can slip into the next day, but that's not ideal."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "How far in advance do you know when they're going to announce the earnings?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "They usually do a pretty good job in sending us 8Ks saying, hi, the company will announce their second quarter earnings at this date after the market closes or before the market closes. So they usually give us a heads up two to three weeks before."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Wow. It sounds stressful. You can't make any impromptu vacations. Yeah, pick up and go to Tijuana for the weekend and party and, oh crap, I forgot, they announced their earnings. It sounds stressful to say the least, but there goes the life of a public company and all those that are involved in that. Who are the investors? Do you invest? Because I know you've got different types of investors. You've got the short-term traders. You've got the long-term buy and hold people, you have the institutional investors. Who are the largest consumers of these research reports? What types of investors?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Types of investors, I think all of them both that you mentioned, but the ones that can usually have more impact on the stock, it's going to be the institutional investors. I know we are heading to a completely different world since GameStop and Reddit and more Robinhood and the entire more inclusion of the market. But currently it's still an institution investors and these being asset managers, portfolio managers and hedge funds. These would be the big-"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I wonder what on earth the equity research analysts were doing when the GameStop and all that stuff was going on."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I can only imagine them spinning their heads and trying to work this out in their financial models."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "It's such an interesting story. It's a great time to be alive to see this because the GameStop episodes, at least for me, I think I can say for some of my friends in the equity research world too, went completely against everything with think about investing. Equity research are very much what we call value investors. So we are looking for the intrinsic value of the company. And the GameStop, if you were to put on a valuation, do a financial model and forecast, GameStop was on the verge of bankruptcy. It was in a very complicated period of their time. And then the stock couldn't stop going up, up, up, up with the coordination from Wall Street Bets Reddit. But now if there is value behind it, I haven't created my own entire financial model of GameStop. I think it became a complex story, a story of its value being created by the equity valuation, meaning since the shares have gone up so much and now this company is able to bring more cash into their balance sheets? Should we revisit the value of this company? But it's a one because without that coordination, that wouldn't be valid."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I think it's a nice segue into ESG, environmental, social and corporate investing. What was the impetus behind that? Was it the kids in their mother's basements on Reddit pissed off at the private equity companies and all the rich, greedy bankers in New York? Is that the issue here? What do you think caused this?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think what caused this was the pandemic had a lot to do with the ESG investing fever. ESG has been around for years a lot of companies actually they have mandatory ESG practices especially."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Back up. What is ESG? And I was referring to the GameStop, by the way, what kind of caused that? Because my premise there is maybe the underlying sentiment or struggles or emotions."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And of course you see this now with capitalism and people decrying capitalism and pointing out the bad impact of capitalism. And maybe that's going to be addressed via ESG. But what is ESG in a nutshell? And then we'll kind of get into the nuts and bolts of it."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Sure. In a nutshell, E stands for environmental, S as social and G governance. And ESG are all the initiatives companies have towards these three main pillars, the environmental, social and governance."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Does that mean prioritizing the environment, not necessarily prioritizing, but caring about the environment a little bit more, caring about the societal impact of your publicly held company and so forth? Is that what we're referring to here in a nutshell?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, in a nutshell is, yeah, what type of practices and subdivided into these three pillars is a company actually addressing? Is the company trying to become net carbon free by 2030, like many companies are doing that? Or if you're a smaller company, it will be very hard for you to set this goal since you have the goal to grow your business first. But since this goal could be potentially unattainable and defeat your business, what other goals could you have towards environmental?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Since now investors, investors meaning equity investors that want to help companies to grow are really looking at these initiatives."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So Facebook, for example, or Twitter, looking at the social impacts of their companies. Would that be an example?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, yes. Facebook, Twitter, Disney, mainly other companies such as airlines, they all just came out saying they will thrive to be net carbon free by 2030. Oil and gas companies, some of the oil and gas companies saying that they will try to use new technologies to capture carbon in the mining industry, especially these industries, they're really intense in the environmental side and can get into the governance sides, anti-corruption, whenever you're dealing with natural resources in different countries."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And the social aspect, that's the social aspect. It touches all sectors, right? And it can be from big companies to small companies. How is that culture? How is the inclusion of the employees? How is the gender gap of that company? And as much as we all should always be paying attention to that, I think the millennials are really, really interested in that. And I can see that on my MBA at UCLA that there is a very big emphasis in this sustainability investing, just trying to narrow down and invest in companies that are not only profits, profit seekers, but profits and purpose. I think that's the transition. The impact on basically humans and our planet, the environment."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So I find this particularly interesting because you look at the difference or the Delta between say Europe and the United States. So in the USA, the board of directors, their fiduciary duties, and the board of directors of course represent the shareholders and they make the primary decisions in the company, their fiduciary duties obligate them to prioritize financial motives over environmental and social motives. Whereas you look at other countries, for example, Germany, and Germany, they have to take into account. And when I say have to, it's actually codified in the law. I can't tell you if it's case law or statutory, but in the US, like I mentioned, it's actually in the law, case law, statutory law, and of course it varies based on the state. So they're legally obligated in the US to prioritize shareholders financial gains, whereas in other countries like Germany would be a perfect example. It's not necessarily the opposite, but it's wildly different. So they have to take into account the social impact. And when I say they, I'm referring to the board of directors. So they have to take into account the social impact and the impact. You, with the international experience that you have, what have you noticed about the U.S. in investing in capitalism versus the rest of the world? And where do you think, if you want to play a fortune teller, where do you think that, or if you want to forecast the implications of this in the future, where do you think this is going to head?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "That's a wonderful question. And I have been more and more interested in the ESG investing side of the business. And along the lines where you're saying about Germany versus US, Europe is way ahead of any continent in the world when it comes to ESG. Europe has been focused on carbon footprint, the social matters of institutions for years now. And to the extent that this entire ESG is already intrinsic in most of the companies. Now, taking a look at America, not only US and South America, and South America with so little money that imagine when you start, it's great if we can substitute our energy generation from coal to solar, but this comes at a cost. So how to balance this profitable as profit versus purpose. But I have never been so optimistic to where the world is going."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think changes in the world come usually from three places and these are Wall Street or Washington or Hollywood. And that this ESG-"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "That's a really, really good point."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "It is. These are the three main points that will cause structural changes to the world. And Wall Street is now looking at ESG. So ESG metrics, it starts being pretty much..."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Why are they looking at it?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "They are looking at it because we got to a point in time that we cannot just overlook it. That will not be capitalism if we stop looking at the environment. And we saw during the pandemic, one of the positives of the pandemic was to see whenever we shut down plants in the world, we saw more animals, extinguished animals coming back. I remember seeing so many of the fowl and flora of the world and seeing the air pollution diminishing. It was very clear for those who don't believe in climate change that when we shut down our manufacturers, actually we have a better quality of life, of animal life, of the air life, all of that. But even before the pandemic, I think back in 2002, alpha, if I'm not mistaken, that's when UN United Nations came to goals for 2030, which are called the SDGs goals, 17 goals for companies to have in mind. And these goals are no hungry, no poverty, clean energy, all of these things that we all should have in mind. Before-"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And when was this? That was 2012 in United-"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Does Wall Street listen to the UN?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I cannot pinpoint the moments that Wall Street really started looking at UN, but something happened in the past two years. And it's been beautiful to see something on the lines of, for example, today, being kept to announce that they will start having a long short hedge fund specializing in sustainability. They will, it's a. It's a hedge fund they will invest only."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Yes."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes. And you can see that with BlackRock, BlackRock now has a strategy in ESG, how they're going to address ESG. Cathie Wood also came out with an entire strategy towards how you were dealing with ESG. And it comes from one set of big investors start doing, then you have that entire effect in others because let's say if I am a very large investor and I want to put my money into private equity and I don't know which private equity I go but I can see that private equity really cares about sustainability and for me I really care about sustainability I'm going to put my money there and not in the private equity that it's looking at any company."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Do you think this will affect the behavior of the public companies because you've mentioned Bain, BlackRock, those are investment companies. But if the underlying behavior of the public companies doesn't change, it's not going to have much of an impact. To what extent do you think investors decision-making process is going to actually impact the actual behavior here that's going to people in the environment?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think will affect a hundred percent."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Because, yes, these are the investors, right? We're talking about the investment side. Now, how a company usually grow? The company can grow inorganically, so the company can start thinking about differentiate and well, sorry, the company can go organically and with everything that the company has within and think about a different method of production, etcetera, inorganically with mergers and an acquisition. But if we have to ask this question of how a company can grow, it's very hard for a company to grow without making an investment. So the company can try to grow organically or inorganically, but money will be part of the equation. And yes, some companies are very healthy and they are able to generate enough cash flow to sustain their growth capital that we talked to early when we were talking about cash flows. But most of these companies actually grow with raising capital and this can be equity or debt. If these investors are not aligned with the lack of sustainability initiatives of a company, there is an entire multimillion finance that this company is now at risk. So even if the company, let's say for a company that does not care about this now, about the environmental, social or their governance, the company will care about how to continue financing their growth. So I think there's going to be very hard for companies, even if they are not, do not feel compelled to any of these beautiful causes. And whenever we touch about lack of financing, they will be kind of obliged to change."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What would you say to Mark Zuckerberg when he listens to this show?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Mark, no, I think Facebook, I think Mark being a millennial, he's already much aware of the ESG impact."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Particularly the social?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Particularly the social. I think hopefully he's treating his employees well and trying to have less impact on the environment."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think my message is more for, for coming. Get rid of the Instagram likes. I think my message would be more for all the CEOs and all the board of directors. They're only thinking about profits. The change is here. The change is not coming. The change has arrived. We, the next generation, the current generation and the next generation of investors are looking at how you think sustainability and to be clear, to make your business more sustainable has been proved. I think McKinsey, not only McKinsey, so many consulting groups have come out with research showing that the beauty of all of that is even when you're thinking about the purpose and thinking about these three pillars, you increase your profitability. So it's one way helping the other. And the case in point is one of the social aspect is the diversity, the inclusion is to bring more women into the workforce, more minority groups into the workforce. And so many research have come out saying how a diverse group can elaborate more creative ideas and how these creative ideas can actually take a business into a different direction than can lead to more profit. So one aspect actually goes hand in hand. Sometimes it's really recreating this mindset that focus on sustainability is just because it's a good mindset to have. No, no, no, it's not only good. It's essential for the business growth."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "This is a very interesting topic to me because you look at the different economic institutions, if you want to call them that, of which capitalism is one. I look at capitalism as any other science. You look at say, healthcare."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And healthcare has evolved tremendously. A hundred years ago, they used to think that certain diseases were caused by God and, you know, they had all sorts of funky beliefs. And you look at capitalism and it's evolved a lot just over the last few decades. And pictures on Facebook, for example, of memes, if you want to call them that, say, of somebody on the street lying there starving and you've got wealthy people in the back eating and it says, you know, capitalism is horrible or whatever. But I think what's important here is that capitalism so far has proven to be the most effective economic institution by far. It's been much more effective across the board in terms of meeting society's needs than socialism and communism and so forth. But it certainly has its flaws and I think what's important is that the participants within capitalism, and it's an extremely complex institution, both social and economic, but the participants are learning and listening and understanding that the institution needs to evolve and continue to improve. Because I think people look at capitalism and just some look at it as inherently bad and just pointing your finger and saying that's bad isn't really going to help the situation, especially when it's the best institution in the history of mankind. To improve it, I think, is certainly an amazing thing. And it's really, really interesting where this might head in, 50 years or 100 years. But do you have any kind of wild guess where you think capitalism might be in the future?"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "in 50 years or 100 years. Because, and to preface that, the essence of capitalism is investing. You have to have returns. To have returns, you have to have growth. You look at a company like Facebook and they have to grow. How do you grow? Sometimes you have to compromise values. You have to compromise society's values. Or with other companies, you have to compromise the environment. So at some point, growth might plateau. So how do you balance those different values?"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "In response to that, where do you think that capitalism might head in X number of years? Do you have any wild guesses or opinion?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I do, Jacob. And I agree with you in the sense that capitalism has been proved as the best economic and political system. We have life proofs of that. I think that one of the best ways to see how different it is, it's comparing North Korea versus South Korea, right? Different systems and how actually this reverberated into the health of these nations. But yes, like everything in the world, needs enhancements, it needs to be more inclusive, it needs to be better, and it needs to start by not focused only on profit. And I think where we are heading in this terminology, was not created by me, it was actually created by Klaus Schwab, who is the founder and executive chairman of the World Economic Forum. And he calls the new capitalism the stakeholder capitalism. So I think essentially we are living the shareholder capitalism, which is this very goal oriented towards whoever has a share in this business."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Very much of the profits you want to see the share price increasing to this stakeholder, which is every person who is involved in that business and in the stakeholder, the shareholders part of it, but the employees also part of it. The environment is part of it. The communities around are part of this, the suppliers. So that's when you were thinking you were brought in who you actually targeting this system. And I think that's the inclusion of that it's missing in the capitalism that will make that system better for the entire world. And to the entire world is not only the human beings, but also our nature for the climate change for everything else, which we are stakeholders of. It's like we dependent on all of that. And I think that's the wild guesses."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "We are leaving the shareholder capitalism to a more inclusive one, which has been called the stakeholder capitalism."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well, very interesting. And to Kim Jong-un, I apologize, Luana used North Korea as an example. So if you do listen, not my fault. You'll have to track down Luana. It was not me. There's a wonderful book, The Ascent of Money, A Financial History of the World by I think it's Niall Ferguson. It's got 1,298 reviews on Amazon at the moment. It talks about the history of money, and I think that kind of puts things into perspective. And it shows you how money and capitalism has evolved. Just a phenomenal, phenomenal book. It's a pretty deep read, intense, pretty academic, but it really puts things in perspective. Luana, what do you think we missed here in terms of our talk here about equity research?"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "If anything."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "No, I think we covered all the fun part of equity research."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well, let's talk very briefly. I know we've been talking for quite a while. Let's talk briefly about your role at Itafos. So you went from equity research to corporate development. In essence, what is corporate development?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "In essence, corporate development is the area of the company that it's almost the in-house investment banking. So that meaning is the group of people who are going to be thinking about the growth of the company. So not try to prevent the company to stay at the status quo and thinking of the strategies. We're going to be looking at investors to finance this growth, looking at potential targets to buy. That's what the corporate development team is focused on."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And Itafos is a, what is it? Tofu and corn?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Tofu. No, we have mining rights in different parts of the world and with a downstream. So we mine phosphorus and produce a fertilizer. And this fertilizer, since it's phosphate based, it's majority it's used in the soybean crops and corn crops."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Okay. I botched that definitely. So what corporate development tools do you use within that realm?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Well, I think one of the most fun experiences I had so far at Itafos, we started the company in 2017, end of 16, 2017. And at that time, we only had one about to be operational business in Brazil and about to produce fertilizer there. And we saw an opportunity. We saw this fertilizer producer in Idaho which was formally owned by a company named Agri that was being sold. And as part of the corporate development team, I helped managements, the CEO, the CFO to acquire that business. So the tool is really like being aware of good opportunities, do a deep dive, do a lot of, again, same thing as we're doing in equity research, a lot of cashflow forecasts to see, if we want to buy this business how much this business are going to be generating in the future, how comfortable I am with this forecast, what I might be missing, what are the legal portions. And then the legal team, of course, gets involved, but we might need to be aware, especially in terms of the almost mixing with ESG, but the environmental, et cetera. There's a lot of that goes into the mining industry and it's always fun. It's an acquisition. We have to really kind of break down a lot of information off of the business, a business that you don't know that it's there for sale, that the company that you are trying to buy gives you a price indication and you have to see if you agree with the price or if you say, no, I did my own analysis. This price is 20% higher than the fair price for your business. So that's the tools that we have. It's a lot of heavy financial valuation and a lot of spreadsheets for sure. And a lot of due diligence."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "How many companies does Itafos own by the way?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "All the companies that we buy, we actually incorporate. So we are Itafos's one holding. And since I had started in terms of acquiring companies with Itafos, I think there are three other positions, but all set below Itafos. But we have around seven, six, seven mining rights in different parts of the world. So you have in the US, we have in Brazil, we have in Africa."},
  {"type": "line", "who": "Narrator", "k": "narrator", "text": "Visit MorganandWestfield.com today to learn more."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "the very detail about that, but I definitely need to know. But I'm, I worked with great people, great in the commercial sides and they are doing that analysis. So all of our commercial and market research team are really doing this analysis to forecast price assist or forecast, how much can we be selling our fertilizer for. So this information, this is really cool because that's the good part of being the corp development. You really are able to work with all the departments of the company. You need to know from the commercial side, how they are seeing the markets. You need to talk to sales, like how much are sales are going? What are you hearing in the hoods? How. or the client's interest in other types of products. If you work with the legal team, you work with the financial planning team. So it's fun in that sense that you are not in a silo. You really have to be able to communicate with everyone from the company."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "And is it true your role as a female in the company and doing what you do? Who is the more optimistic gender?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Man."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Is that biological?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think it's biological. I think so. I think men are more, I think sometimes I think when a very good executors, right? Like to spot opportunity and like laser focus on executing, closing the deal. And they just want to get things done."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Because our brain is so simple. We don't get distracted."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think when I work with women, we are more cautious. It's more just, not only about the deal making, but really making the best of the deal. So more like, let me not make a decision in the next three minutes and think. So I think we know the power of a pause."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well, you know, the biological differences I noticed when I had my dog, I was in Thailand at the time and my dog was in heat. And I think that's the first time it really struck me. My dog was in heat and oh my God, I mean these dogs followed my dog home for miles and miles and they would do anything humanly possible just to impregnate her, which of course is a biological desire. Then later on I'm driving through Yellowstone and I see Bison goring each other to death just so they can have the opportunity to be able to pass on their genes with another female. So it's interesting that these behaviors, that there's a biological basis in these behaviors and even in the investors from their point of view as well. You read Warren Buffett in his, not his books, but books about him, which are derived from his annual shareholder letters. And he talks so much about human behavior."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I believe Ray Dalio does as well, but how often do you incorporate human behavior into your decision-making process?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I have the benefits, which sometimes comes with disadvantages, for being raised by two psychoanalysts. So I was raised in a house that was always talking about human behaviors, Freud, and I went into finance. And when I was studying, back in college, I did my undergrads in Brazil. That's when the behavior finance class of study was actually really upsurging and more and more organization behavior and the behavior in investments have been almost proven to be a fact. So for me, I'm always aware that as humans, we are putting a little bit, if not a lot of ourselves in the decisions we are making, we sometimes we discard the numbers, the numbers can be pointing us to a direction. And because of some psychological effects that we are going through, we decided to take the opposite side. So I really try to incorporate my, to be aware that our psychological behavior will have an impact and distance myself off that to not create bias in any type of decision."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What does a psychoanalyst do, by the way?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "A psychoanalyst, instead of analyzing numbers like I do, they analyze people. So a psychoanalyst is essentially you go to a psychoanalyst's office and for 45 minutes you talk about what has been bothering you and trying to figure out your traumas, childhood."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Oh, so a psychologist?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "A little bit different than that. Yeah, it's similar to a psychologist. It's a little bit the difference. It's mainly a psychoanalyst follows much of a Freudian approach. So Sigmund Freud versus a psychologist not necessarily is following Freud's approach."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well, very, very, very interesting."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What other differences do you notice between the genders and then what's it like being a woman or a female in finance?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, has been for sure an interesting ride here. Like back at Raymond James, for example, for one year, for one period that two of my colleagues had left, I was the only woman around 24 men."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And it's just interesting to see how male dominance the industry has. And in the corporate dev team, now in Itafos, I'm also the only woman surrounded by a board of directors that it's male dominant, it's management that it's only male. I think it's what I like about working with men, it's very practical. I think men have that quality of whenever we're getting to very much overwhelming details, man knows how to kind of draw the line of, hey, let's cut here and move to the next step. I think what things that are missing-"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Keep the compliments going."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think what it's missing is-"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Uh-oh. Uh-oh."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I think what it says is there's a lot of ego. That it's, you know, it's."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "They have big egos and that's when you can see the psychological effects, really kind of not impairing the best decision. I think women, we are not that ego driven and it's, hey, if your decision tells more and makes more sense, by all means, we're all on the same team here. Let's follow your decision, not mine. And sometimes I can see ego being a constraint. And secondly, I think it's that EQ, that emotional intelligence of judging certain things, judging the center for analyzing certain things with more in-depth that it's necessary that women can really do a good job. That's like, hmm, let me get into this calm set of mind. It's going to take me maybe longer, but it will be worth it."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "So EQ along the lines of like Daniel Goleman'sWhat's the name of his book? Is it emotional intelligence?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Emotional intelligence, yes. I think, and look, I met a lot of male colleagues with high emotional intelligence in these years, but I see something, I think it's more natural in women."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "I don't know if that's been asked before, but as a female, what's your advice to business owners or anybody in the profession, attorney, accountant, equity analyst, so forth. They have a meeting with you they don't know it's a female, you come around the door and they look up and boom, and they're not expecting a female. Do you want to be treated differently or what mistakes do you see men make? What's your advice to them and how you're treated?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "I have been extremely lucky throughout my career that I have never felt treated differently for being a female, but I know some of my friends have in the sense of oh, let's not get really stressed in a moment of stress of a company because there is a female there. So really trying to make that business more suited for female. But I have never experienced that. I was very lucky to work with all the male bosses that I had. I always felt treated equally. I think one thing that bothers me sometimes that I would definitely give as an advice is the entire, like we became so much involved into this hashtag MeToo, so much afraid of the male, female more contact that sometimes I think men just don't want to invite a female for a dinner, a business dinner or a lunch dinner or happy hour dinner. I see a lot of like males doing that, I see very clear like at UCLA, for example, I have to reach out to my male friends. Otherwise I felt that they felt a bit worried to reach out to me. And I think that was kind of one of the consequences of MeToo. Don't be afraid, please. Like females want to network with everyone. So please don't be afraid. Don't be discouraged. And yes, that it's something that has bothering me in the past years."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "What about internationally? Have you noticed any differences?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes. Yes. I think, for example, coming from Brazil, that is not an issue in Brazil at all. I think we are just very different in the way of, I don't see this female male lack of networking as I see here. I think the US being the country of lawsuits, it makes things sometimes harder."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "But in Brazil, that's not an issue at all. I have so many male friends and colleagues and they always felt so comfortable inviting me for like this networking set and never being afraid of, well, she thinks this is inappropriate. So, and I guess in the entire South Europe, I had so many business meetings in Europe in the past years and in South America in general, I think in the US has this, they sometimes may can be over worried about being inappropriate and hey, don't, just don't be inappropriate, but invite us for business dinners."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Are there any other major differences you've noticed between North and South America?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "In general or gender oriented?"},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Either that or finance, economics, capitalism."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, capitalism for sure. I think it's when you come to the US, you really see capitalism. You see Wall Street and it's like, wow, I love it. I love living here. I think work hours. In South America, we are very much used to our eight hours work hours. I think it's very rare for me to work eight hours a year. My work days are usually 10 to 12, if not 14 hours. So the work ethics that I've learned in the US, it's something that even if one day I move, go live in Singapore, who knows, I love living in different cultures, I will take it with me. US work ethics is really encouraging to see, really inspiring."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well-traveled woman, you've got tons of experience. Any final advice to anybody, your future self, your past self, business owners, college students, any final advice that you'd like to wrap up with?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Sure. I think my, we talked about ESG and how this is changing the world. It's some change that I see going on from shareholder capitalism to stakeholder capitalism. The other change that I really see is that upbringing of more and more emotional intelligence of try not to separate your work life from your personal life in the sense of this create a different persona at work versus your personal persona for your own self. Like I see that people are sometimes they just they want to distance themselves. It separates so much the work and life and this work life balance."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Like work is part of life and life is part of something bigger. So that it's my advice. Make friends at work. In all places I worked, I made friends. Not only colleagues, but with friends. It makes working with them so much more rewarding. It's so much nicer when you work with friends."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Well, it sounds like somebody paid you to tell me that. I don't know who, but you don't have to track them down in reprimand."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yes, and I will have to unfriend them."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "As long as not in North Korea. A wonderful conversation about equity research, about Itafos, capitalism. I think we've covered a lot of ground and we appreciate you coming on the show. And if I don't hear from you again, I definitely know Kim Jong Un listen to the show and has somehow found a way at some airport to make you disappear."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Anyways, we enjoyed having you on the show. If people do want to get a hold of you, what's the best way to get a hold of you?"},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Yeah, please get a hold of me on my LinkedIn, Luana Helsinger, H-E-L-S-I-N-G-E-R. I'll be more than happy to chat, to exchange more ideas, to talk more about equity research. We'd love to hear from you."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "And I thank you so much, Jacob. This was definitely very interesting, very good questions. My head is now spinning. It was almost like building a financial model here. We touched a lot of grounds, but yeah, I really enjoy it. Hopefully I'll come back in the future."},
  {"type": "line", "who": "Jacob", "k": "host", "text": "Likewise. Thank you very much, Luana."},
  {"type": "line", "who": "Luana", "k": "guest", "text": "Thank you. Bye bye."},
  {"type": "line", "who": "Narrator", "k": "narrator", "text": "M&A Talk is brought to you by Morgan & Westfield, a nationwide leader in mergers and acquisitions for small to mid-market companies."},
];

// FOMC press-conference transcripts (U.S. Federal Reserve, public domain)
const FOMC_WARSH = [
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Good day. It’s an honor, a true honor, to be back at the Federal Reserve, and to take up this duty at a time of such consequence. I have been especially heartened by the warm welcome of old friends and new colleagues, both, and I have listened closely to my fellow FOMC members. I’ve heard a lot of new ideas, new thinking, and genuine interest in moving the Fed forward. This week’s FOMC meeting exemplified the very best of the Fed’s traditions: rigorous debate, open-mindedness, commitment to mission, responsibility, and accountability for performance. In this business, they all add up to one thing: getting monetary policy right—or as near to it as we can do. That is our north star. My colleagues and I are here to serve our legislative remit, which you’ve heard us say before—price stability and maximum employment—and these objectives guided our business in the meeting just concluded. As you saw a few moments ago, the Committee decided to maintain the target range for the fed funds rate at 3-½ to 3-¾ percent, in support of the Fed’s dual mandate. The Committee also reaffirmed its policy of maintaining ample reserves in the banking system. Economic activity is expanding at a solid pace despite elevated uncertainty that owes, in part, to the conflict in the Middle East. Productivity growth and capital investment are both strong. Job gains have kept pace with the workforce, and the unemployment rate has changed little. We recognize that inflation has been running well ahead of the Fed’s long-stated inflation goal of 2 percent that’s been going on for more than 5 years. Persistently high prices are a burden for the American people. But the recent past need not be prologue. I am pleased to report that members of the FOMC are unambiguous and unanimous: This Committee will deliver price stability. At any institution, a change in leadership is a natural and timely opportunity to reaffirm its mission, to review current practices, and to consider whether those practices best meet our objectives. My Fed colleagues and I will be working in close collaboration to ask what changes might improve the conduct of monetary policy. On that score, you might have already noticed something: a difference in today’s policy statement. It’s a bit shorter, a bit simpler—and it dispenses with some older language. That statement just gives you the facts, as best we can judge it. Absent, also, is so-called “forward guidance,” which we agreed was not well-suited to the current policy conjuncture. This afternoon you also received the usual Summary of Economic Projections. It’s been the practice of this Committee for participants to submit these projections, and I have encouraged my colleagues to continue to do so. I, however, have refrained from offering any projections of my own—consistent with my long-held views on the SEP, at least as currently structured. In the median projections, real GDP rises at 2.2 percent this year, 2.3 percent next year, and total PCE inflation runs at 3.6 percent this year, 2.3 percent next year. The unemployment rate stands at about 4.3 percent. The median participant judges the appropriate federal funds rate to be at 3.8 percent at the end of this year and 3.6 at the end of next. Let me turn now to a few words on a key initiative that we are announcing today. I am appointing a task force in each of five areas that are central to the broad conduct of monetary policy: First, Fed communications; second, the Fed’s balance sheet policy; third, our use and reliance on existing data sources; fourth, productivity and jobs in an era of transformation; and last, the Fed’s inflation frameworks. These subjects are timely, consequential, and in my view worthy of a fresh look. My colleagues and I discussed them with energy and purpose over the last couple of days. For each of these independent task forces, I am enlisting some of the very best minds—both inside and outside the economics profession. They will be supported by subject-matter specialists from our superb Fed staff. And they will have a straightforward charge: start with first principles; ask hard questions; examine current practice; consider alternatives; and, ultimately, propose next steps for policy maker consideration. Since last summer, my colleagues discussed possible improvements in the form and function of Fed communications. This new task force will build on that effort—and, I expect, propose some well-considered changes, including to the SEP I mentioned a few moments ago. The second task force, the one on balance sheet policy, will review the benefits and risks of the current ample reserves regime, and the composition of the Fed’s balance sheet. They will assess alternative frameworks for the conduct and operation of monetary policy. The third task force, the one on data, will evaluate new information sources and consider methodological changes to improve data gathering, with the aim of giving policy makers more accurate, relevant, contemporaneous, and perhaps most important actionable information on the state of our economy. Fourth, the task force on productivity and jobs. It will survey the pace, the reach, and economic impact of new general-purpose technologies, including AI, and explore the implications for the Fed in pursuit of our employment and inflation mandates. The last task force, the one on inflation frameworks, will examine the drivers of inflation, first principles, and weigh the full range of ideas for delivering price stability in a changing economy. You will hear quite a bit more about these task forces and this overall initiative in the coming weeks. Enough for now to make a simple statement—each task force will serve an objective shared by everyone in the System, shared by everyone around that table that I sat with over the last couple of days: a Federal Reserve that is clear-eyed about its mission, fit for purpose, and focused on the future. And with that, I appreciate your attention, and I’m happy to take your questions."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Howard Schneider."},
  {"type": "line", "who": "Howard Schneider", "k": "guest", "text": "Oh, hi, Chairman, Howard Schneider, with Reuters. Good to see you again and welcome back. This is a lot to be putting in motion so fast. What is the timeline you have in mind for each of these?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So I think it'll depend on the task force and also depends on the urgency in which we need clear answers. My expectation—I'm still in the business of recruiting and finalizing them—my expectation is the task forces will begin work in the next couple of weeks and we'll start to get some more information from them, some more framing of how they see things, starting in the fall, and hopefully most, if not all of them, concluding by yearend."},
  {"type": "line", "who": "Howard Schneider", "k": "guest", "text": "And just specifically on the inflation framework, you talk about first principles, does this include a review of the 2 percent target itself? You've mentioned that things to the right of the decimal point don't matter. Should this be starting from a premise that 2 percent as a point estimate is too strict?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Let me break that into two pieces. First on the inflation framework review, their remit is what are the drivers of inflation, what's the Fed's responsibility for inflation, in part how do we measure inflation, but that'll overlap with my data group. On the 2 percent inflation objective, that is the Federal Reserve's long-held objective of 2 percent. You've heard me say before I tend to focus on the left of the decimal point. Well, the two is the left of the decimal point. For now zero is to the right. I see no reason until we have reestablished our commitment and ability to deliver on the 2 percent inflation objective to revisit that. So that'll be outside the scope of what we're taking on."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Colby."},
  {"type": "line", "who": "Colby Smith", "k": "guest", "text": "Thank you so much, Colby Smith with the New York Times. You've in the past said that inflation is a choice and in the policy statement it includes this pledge to deliver price stability, as you've reiterated today. But looking at the SEP, the bulk of your colleagues expect core PCE to run around 3.3 percent by yearend and for the 2 percent inflation target not to be reached until 2028. So I'm curious how patient you think the Fed can afford to be at this juncture in terms of waiting for one-time inflation waves to wash through and for underlying inflation to step down after so many years of inflation running above target, and under what circumstances you would support the Fed taking some action and raising rates."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Sure. So quite a bit there. Let me try to break that into pieces. First, we have the capability and commitment to deliver on our price stability objective of 2 percent. That's exactly what we're going to do. In the Fed's review of its strategy over the last any number of years—in January the Fed, including the strategy that we're still bound by, the Fed statement says that inflation is primarily determined by monetary policy. You bet it is. I've said for years inflation is a choice. You bet it is. And today I'm announcing that this committee unambiguously and unanimously have decided we are going to deliver on that. Rest of your question sounded like an encouragement for me to give forward guidance. We've dropped forward guidance. Some along the committee I think dropped it, I suspect from our discussion last couple of days, because they said at this moment in time, it doesn't feel as though providing forward guidance is right. Others have, I'd say, different views and think as a general proposition forward guidance isn't the business we should be in. But that'll be taken up by the task force on communications, and my policymaker colleagues we're going to listen hard to what the experts say and make our own decision. But I can't give any forward guidance about what we're going to do next. The good news is we'll be meeting in six weeks."},
  {"type": "line", "who": "Colby Smith", "k": "guest", "text": "So just following up, I guess on the current policy settings then, I am curious how restrictive you think things are at the current moment, given the flow of data that we've seen and, you know, forecasts that are coming down the pipeline."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Yeah. I've heard characterizations, both inside in the Fed about that. I'll give you my own. It's uneven. And if I look at the housing markets as one example, Fed policy isn't the single determinant of the state of the housing market, but broadly I would say there Fed policy appears to be somewhat restrictive. I would have a hard time managing to say those words if I were to see what's happening in financial markets, so I'd say it's uneven. That's perhaps a function of different transmission mechanisms of monetary policy, whether monetary policy is coming from our interest rate tool or our balance sheet tool. But the good news, we have a task force on that, too, and the balance sheet task force will be looking more at that subject."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Mike McKee."},
  {"type": "line", "who": "Michael McKee", "k": "guest", "text": "You said you don't like forward guidance, you dropped it from the statement this time, but with the dot plot, nine members suggested that they want a rate increase by the end of the year, and the markets have taken that as forward guidance. So what does this mean in terms of how you guide the markets and in terms of what the dot plot's future is?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "I'm going to have to give you the same answer I gave to Miss Smith, we've got a task force for that. I'll give you a little bit more. I reviewed the dot plots and when I saw the submissions, I noted that all the submissions were coming in with pencils, you know those kinds with the big erasers. That's to say that I think my colleagues around the table when they submitted their dots, understand the world is changing quite quickly. And they didn't feel bound by them six weeks from now or six days from now, and in the event that their circumstances change. I'll note a couple other things. What I heard around the table was as they submitted their modal forecast, their modal forecast, to be clear, weren't this was more likely than not, this was more likely than their other scenarios. So I didn't hear tons of conviction. What I heard was the kind of humility that I think we should have. I did not submit a dot. For me it's not helpful in the conduct of policy. I suspect by yearend, as I mentioned in my opening statements, there'll be a review about communications broadly, press conferences, dots, meetings, and the like, transcripts, minutes. This will be part of that. I don't want to prejudge the outcomes there, but I'm pretty open-minded about what they could be. And I was just incredibly impressed over the last couple of days. My colleagues over the last two days, and frankly, the first three weeks I've been here, they've been very open about changes. Change isn't easy, change is filled with risk. But our number one goal is to get monetary policy right. The way to get monetary policy right is to deliver on the agreement that Congress gave us to deliver on price stability. And there was no disagreement on any of those points."},
  {"type": "line", "who": "Michael McKee", "k": "guest", "text": "At the risk of possibly getting the same answer about task forces, communications, what is your feeling about these new conferences, are you going to continue one after every meeting, do you think find them useful? What is the future for the way Kevin Warsh will communicate?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Well, this one's probably got another 15 or 20 minutes in it, so I don't want to prejudge the outcome. Press conferences can be a very useful way to communicate with households, businesses, and more broadly, through using the likes of you. I had a great old mentor named George Shultz, and his mantra was, \"Press conferences are useful. But when you have one, you want to make sure you have something important to say.\" Today I think we had something important to say about our commitment to deliver on price stability, our commitment to rethink practices with an eye of moving the Fed forward, and to give you and the American people a sense that these aren't idle thoughts, these are concrete thoughts that we're going to seek out the best minds, both the best thinking inside of the Federal Reserve and the best people I know in business, and economics, and the academy, and technology, and the rest, to share their views. That's what we're going to be doing here, the pursuit of truth. I think we're going to come up with some new and interesting things. We made some changes today, I expect more changes to come, and some of those might well be worthy of a press conference."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Chris Rugaber."},
