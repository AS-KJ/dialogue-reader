  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So every major advanced economy in the world has made the same decision the United States has made. And that is that they want to take the making of monetary policy, the setting of interest rates to support the economy, to achieve maximum employment and price stability—they want to take that out of the direct control of elected politicians. And the reason is elected politicians are always running for election and they'll always want low rates, and that will lead to inflation over time. So after, you know, literally centuries of experience with that, the whole world moved to the different model. And it's worked great. I mean, this is—this is the era in which inflation was under control for 40 years. Then we had the pandemic—inflation everywhere in the world. And now we have inflation that had gone pretty much all the way back to target—really close to all the way back to target and now is being buffeted by the energy shock in the U.S., buffeted by the—by the tariff shock as well. But what I would say to the general public is—that's the backstory—is that don't think about an institution being independent. Think about it this way—that you want people to make monetary policy and set interest rates to benefit the general public and to try to achieve economic goals, which are maximum employment and price stability, and focus only on that and ignore political considerations, completely ignore them. It's—this isn't bipartisan, this is nonpartisan. So we want to just—we just work directly for the American people doing these things. We don't think, \"Oh, this—I want to do this because the President says it's a good idea or because there's an election coming up and I want to—I want to speed up or slow down the economy.\" I mean, that—think about that. If that's—if that—if that's what we were doing, we'd have no credibility, markets would lose faith in us and our ability to control inflation and have any respect would be, you know, would be gone. And let me say—whatever people say, the markets believe that we will produce 2 percent inflation. If you look at longer-run expectations, markets believe that—there's no sense in which our credibility in the markets has weakened. It's just not the case. It's—people do get it that this is our commitment and that we will achieve it and it's priced in. If you disagree with that, then you can go ahead and bet against the markets. But the markets are pricing in Fed credibility."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Okay, we'll go to Richard for the last one."},
  {"type": "line", "who": "Richard Escobedo", "k": "guest", "text": "Thank you, Chair Powell. Richard Escobedo with CBS News. We've talked a lot about gasoline prices, and even you mentioned airline ticket prices, both of which are up dramatically because of the war in Iran. And so I wonder, are you seeing that weigh down consumer spending in other parts of the economy? And, if so, how worried are you that that will be a drag on growth?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You don't see—you don't see it in spending yet. You really don't. I mean, as one of your colleagues said, the economy has been resilient—it really has—not just this time, but it's been remarkably resilient for some years now. The U.S. economy has just powered through shock after shock. And consumers are still spending. And that's what—that's what the banks will tell you, credit card companies will tell you. The retail sales numbers that we got most recently—people are still spending. And, you know, how long can that go on in a world where—if gas prices were to go up a bunch more, that's taking otherwise spendable money out of people's pockets. But, right now, we don't actually see much slowdown in—yet from—certainly, none from this. But you think logically you will because people have a certain amount of money they spend. If they're spending 25 percent more on gas or something like that, then, you know, that's going to come out of other spending. But we—again, we don't see it yet."},
  {"type": "line", "who": "Richard Escobedo", "k": "guest", "text": "One last thing. You mentioned those economies in Southeast Asia that are particularly dependent on petroleum. They make a lot of the stuff that American consumers buy. So was there any discussion today about whether or not those costs getting passed along to consumers is a real concern, and whether or not that might push up inflation?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So all of those things are in—are in the models that we use to calculate inflation. So we—you know, they're just parts. You can ask about anything like that, and they are—they have a place—the staff has a place where they're looking at that and pricing in what will happen with higher prices and that kind of thing. So it's there. The effects are not that big yet. You know, we're a huge economy. The import sector is only 10 percent of the economy. So we're not like a European country where 50 percent of the external—of GDP is in the external sector. We're also, you know, as I mentioned, we're an oil exporter, so we're not feeling the same kind of pain—and we're not likely to feel the same kind of pain—that economies in Western Europe and, certainly, in Asia are feeling. Anyway, thank you very much, everyone. I won't see you next time. [Laughter]"},
];

/* ============================================================
   SETTINGS — change the password here:
   ============================================================ */
const PASSWORD = "hottea";
/* ============================================================ */

/* ---------- build episode objects ---------- */
const _fmeta = SCRIPT.find(b => b.type === 'meta') || {};

const FRIENDS_EP = {
  id: 'fr-s1e1',
  epShort: 'No. 1',
  kicker: 'Sitcom Dialogue',
  title: _fmeta.title || "Episode 1",
  sub: _fmeta.sub || "",
  credit: _fmeta.credit || "",
  meta: "≈ 230 lines · 15 scenes · 6 main speakers",
  blurb: "Rachel bolts from her wedding and turns up at the coffee house; Ross's marriage has just ended; Monica has a not-a-date with Paul the Wine Guy.",
  script: SCRIPT.filter(b => b.type !== 'meta')
};

const MA_EP1 = {
  id: 'ma-1',
  epShort: 'No. 1',
  kicker: 'M&A Talk · Interview',
  title: "How Public Company Valuations Can Affect the Value of Your Business",
  sub: "M&A Talk Podcast — Morgan & Westfield",
  credit: "Host: Jacob (Morgan & Westfield) · Guest: Luana Helsinger (Itafos)",
  meta: "≈ 288 turns · interview · Host, Guest & Narrator",
  blurb: "Equity-research professional Luana Helsinger and host Jacob talk through valuation, forecasting cash flows, equity research, ESG, and building a career in M&A.",
  script: (typeof MA1_SCRIPT !== 'undefined') ? MA1_SCRIPT : []
};

const FOMC_POWELL_EP = {
  id: 'fomc-2026-04-29',
  epShort: 'Apr 29, 2026',
  kicker: 'FOMC · Press Conference',
  title: "Chair Powell\u2019s Press Conference",
  sub: "FOMC · April 29, 2026",
  credit: "Federal Reserve · Chair Jerome Powell (final transcript)",
  meta: "Opening statement + Q&A · 90 turns",
  blurb: "Powell\u2019s final press conference as Chair: holding the funds rate at 3\u00bd\u20133\u00be%, the debate over the easing bias and three dissents, energy and tariff shocks, and a long defense of Fed independence.",
  script: (typeof FOMC_POWELL !== 'undefined') ? FOMC_POWELL : []
};

const FOMC_WARSH_EP = {
  id: 'fomc-2026-06-17',
  epShort: 'Jun 17, 2026',
  kicker: 'FOMC · Press Conference',
  title: "Chairman Warsh\u2019s Press Conference",
  sub: "FOMC · June 17, 2026",
  credit: "Federal Reserve · Chairman Kevin Warsh (preliminary transcript)",
  meta: "Opening statement + Q&A · 63 turns",
  blurb: "Warsh\u2019s first press conference as Chair: rate held at 3\u00bd\u20133\u00be%, a shorter statement with forward guidance dropped, five new policy task forces, and a repeated pledge to deliver price stability.",
  script: (typeof FOMC_WARSH !== 'undefined') ? FOMC_WARSH : []
};

/* ---------- series ---------- */
const SERIES = [
  {
    id: 'sitcom',
    name: 'Sitcom Dialogues',
    note: 'Conversational, everyday English',
    episodes: [ FRIENDS_EP ]
  },
  {
    id: 'matalk',
    name: 'M&A Talk',
    note: 'Business & interview English',
    episodes: [ MA_EP1 ]
  },
  {
    id: 'fomc',
    name: 'FOMC Press Conferences',
    note: 'Central-bank & formal English',
    episodes: [ FOMC_POWELL_EP, FOMC_WARSH_EP ]
  }
];

/* fast lookup of every episode by id */
const EP_BY_ID = {};
SERIES.forEach(s => s.episodes.forEach(ep => { EP_BY_ID[ep.id] = ep; }));

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function withParens(s){return esc(s).replace(/\(([^)]*)\)/g,'<span class="paren">($1)</span>');}

/* ---------- password gate ---------- */
const gate = document.getElementById('gate');
const pwInput = document.getElementById('pw');
const pwErr = document.getElementById('pwErr');
const AUTH_KEY = 'dialogue_auth';

function tryPw(){
  if(pwInput.value === PASSWORD){
    try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
    gate.classList.remove('show');
  }else{
    pwErr.textContent = 'Incorrect password';
    pwInput.value = '';
  }
}
document.getElementById('pwBtn').addEventListener('click', tryPw);
pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryPw(); });

let authed = false;
try{ authed = sessionStorage.getItem(AUTH_KEY) === '1'; }catch(e){}
if(!authed){ gate.classList.add('show'); setTimeout(()=>pwInput.focus(),100); }

/* ---------- screens ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------- list screen (grouped by series) ---------- */
function buildList(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  SERIES.forEach(series=>{
    const sec = document.createElement('div');
    sec.className = 'series-head';
    sec.innerHTML = '<span class="series-name">'+esc(series.name)+'</span>'+
                    '<span class="series-note">'+esc(series.note)+'</span>';
    wrap.appendChild(sec);
    series.episodes.forEach(ep=>{
      const c = document.createElement('button');
      c.className = 'card';
      c.innerHTML =
        '<span class="label">'+esc(ep.kicker || series.name)+'</span>'+
        '<h3>'+esc(ep.title)+'</h3>'+
        '<div class="blurb">'+esc(ep.blurb)+'</div>'+
        (ep.meta ? '<div class="meta">'+esc(ep.meta)+'</div>' : '')+
        '<span class="go">Read <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      c.addEventListener('click', ()=>openEpisode(ep.id));
      wrap.appendChild(c);
    });
  });
}

/* ---------- reader ---------- */
const reader = document.getElementById('reader');
const tocList = document.getElementById('tocList');
const tocOpenBtn = document.getElementById('tocOpen');
let sceneEls = [], tocItems = [];

function openEpisode(id){
  const ep = EP_BY_ID[id];
  if(!ep) return;
  document.getElementById('readerEp').textContent = ep.epShort || '';
  renderEpisode(ep);
  showScreen('screen-reader');
  window.scrollTo(0,0);
  onScroll();
}

function renderEpisode(ep){
  reader.innerHTML = '';
  tocList.innerHTML = '';
  const scenes = [];
  let sceneCount = 0;

  const m = document.createElement('div'); m.className='masthead';
  m.innerHTML =
    '<div class="kicker">'+esc(ep.kicker || 'Transcript')+'</div>'+
    '<h1>'+esc(ep.title)+'</h1>'+
    '<div class="sub">'+esc(ep.sub)+'</div>'+
    (ep.credit ? '<div class="credit">'+esc(ep.credit)+'</div>' : '');
  reader.appendChild(m);

  (ep.script||[]).forEach(block=>{
    if(block.type==='scene'){
      sceneCount++;
      const id='scene-'+sceneCount;
      const d=document.createElement('div'); d.className='scene'; d.id=id;
      d.innerHTML='<span class="tag">Scene '+sceneCount+'</span><div class="desc">'+esc(block.text)+'</div><div class="ln"></div>';
      reader.appendChild(d);
      scenes.push({id,n:sceneCount,desc:block.text});
    }else if(block.type==='marker'){
      const d=document.createElement('div'); d.className='marker'; d.innerHTML='<span>'+esc(block.text)+'</span>';
      reader.appendChild(d);
    }else if(block.type==='direction'){
      const d=document.createElement('div'); d.className='dir'; d.textContent=block.text;
      reader.appendChild(d);
    }else if(block.type==='line'){
      const d=document.createElement('div'); d.className='line k-'+(block.k||'other');
      d.innerHTML='<span class="who">'+esc(block.who)+'</span><span class="txt">'+withParens(block.text)+'</span>';
      reader.appendChild(d);
    }
  });

  scenes.forEach(s=>{
    const b=document.createElement('button'); b.className='toc-item'; b.dataset.target=s.id;
    b.innerHTML='<span class="n">Scene '+s.n+'</span>'+esc(s.desc);
    b.addEventListener('click',()=>{
      closeDrawer();
      const el=document.getElementById(s.id);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    });
    tocList.appendChild(b);
  });
  sceneEls = scenes.map(s=>document.getElementById(s.id));
  tocItems = Array.from(tocList.children);

  /* hide the Scenes button when this transcript has no scenes */
  tocOpenBtn.style.display = scenes.length ? '' : 'none';
}

/* ---------- back ---------- */
document.getElementById('backBtn').addEventListener('click', ()=>{
  closeDrawer(); showScreen('screen-list'); window.scrollTo(0,0);
});

/* ---------- font size ---------- */
let scale=1; const MIN=0.8,MAX=1.7,STEP=0.1;
function applyScale(){document.documentElement.style.setProperty('--reader-scale',scale.toFixed(2));}
document.getElementById('fzUp').addEventListener('click',()=>{scale=Math.min(MAX,+(scale+STEP).toFixed(2));applyScale();});
document.getElementById('fzDown').addEventListener('click',()=>{scale=Math.max(MIN,+(scale-STEP).toFixed(2));applyScale();});

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');document.body.style.overflow='';}
tocOpenBtn.addEventListener('click',openDrawer);
document.getElementById('tocClose').addEventListener('click',closeDrawer);
scrim.addEventListener('click',closeDrawer);

/* ---------- progress + active scene ---------- */
const progress=document.getElementById('progress');
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const h=document.documentElement.scrollHeight-window.innerHeight;
    const p=h>0?(window.scrollY/h)*100:0;
    progress.style.width=Math.max(0,Math.min(100,p))+'%';
    let activeIdx=-1;
    for(let i=0;i<sceneEls.length;i++){
      if(sceneEls[i] && sceneEls[i].getBoundingClientRect().top<=90) activeIdx=i; else break;
    }
    tocItems.forEach((it,i)=>it.classList.toggle('active',i===activeIdx));
    ticking=false;
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);

/* ---------- init ---------- */
buildList();
showScreen('screen-list');
</script>
