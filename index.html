  {"type": "line", "who": "Chris Rugaber", "k": "guest", "text": "Hi, Chris Rugaber at Associated Press. Thanks for taking our questions. Could you give us a sense of how you see inflation more in the long term? I know you may not want to comment on the ups and downs, but is this mainly driven by energy prices and the Iran war at this point, or do you have any concerns about underlying inflation pressures in the economy? Thank you."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So I can't do much better than the committee just did, so let me restate it. Inflation remains elevated relative to the committee's 2 percent goal, in part reflecting supply shocks that have driven price increases in certain sectors, including energy. That paragraph goes on to say, \"But to be clear, the Fed will deliver price stability.\" My own judgment is the committee spent quite a bit of time not just in two days but over iterations of a couple weeks. That's what we're prepared to say about inflation, but the commitment to deliver is strong, unanimous, and unambiguous. And that's I think an important message we've missed for five years, and we're going to fix that."},
  {"type": "line", "who": "Chris Rugaber", "k": "guest", "text": "Well, great. And then just on your—the data task force and everything else, I mean, generally speaking I think people feel the Fed looks at everything already, certainly that was the sense from before. What's—is there data that you feel is not given enough weight? I mean, you mentioned the trend of the mean in the past, but again, that's well known to certainly most Fed members. So what is that task force looking at and what might be the—I mean, I know you don't want to prejudge the outcome, but are there examples of data that you expect might be given more weight? Thank you."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So you're answering my question, so let me say, I don't want to prejudge the outcome. I also don't want to say too much about what they're going to do because I still have a phone call or two to make before I've nailed down the people that are doing that. I'm interested what the outside experts' view is on the subject. I'll say this generally. Most of the data that central bankers and other government officials in the United States consume come with old-fashioned survey methods, national accounts of what the U.S. economy looks like that looks very little like the U.S. economy in 2026, survey methods that don't have response rates that we need, asking questions that might've been quite applicable a generation ago that are less applicable now. So even inside of official statistics, I would be open-minded if the task force and our own best thinking had recommendations how those official statistics can be brought up to a standard of our time using new analytic methods. I'd also say this, almost every private company CEO that's running his or her business are doing so with real-time information that isn't subject to much revision, that is telling them what just happened at that very moment. As you know, there are normal long and variable lags in the conduct of monetary policy. What we're really interested in is what's happening right now. What we're less interested in is echoes of history. And you're hearing from my answer that some of the data that we receive, that we're waiting on the first Friday after the month of payroll index or something else, that might be an echo of history that's quite useful on its third revision. We need to take those error bounds down because we have to make hard decisions in real time. I'm really open-minded that there are a lot of new data sources that we can learn from the private sector, from reforms in the official sector, and new analytic techniques that are far more refined than asking a simple question about whether something was core or noncore."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Edward."},
  {"type": "line", "who": "Edward Lawrence", "k": "guest", "text": "Thanks. Welcome, Mr. Chairman. Edward Lawrence with Fox Business. So, if you don't give a lot of ongoing forward guidance, won't the market have more volatility, and shouldn't Americans have more access into what you're thinking going forward?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So I think financial markets perform best when they react to incoming data. I think the financial markets work less efficiently when they ask a question. How will the Federal Reserve react to that incoming information? The more that markets are paying attention to what's happening in the real economy, deciding what's good data and what's less good data, the more financial markets can price what they believe is the most likely and what are the tail risks. Financial market prices are probably the most important source of information to guide central bankers. But when all the financial markets are doing is reflecting back what we've said, then we're taking the most important source of information and we're being blind to it. I'd like us to create a system where those blinders come off, where markets are following data that they efficiently think is reliable. And they'll be watching data, we'll be watching data. They'll come with better information through market prices to us, we can make more informed decisions. But ultimately, the goal that I said at the outset, deliver on the price stability objective that Congress told us to do, and that we've got to get in the business of doing."},
  {"type": "line", "who": "Edward Lawrence", "k": "guest", "text": "Yeah, if I could take you in the meeting a little bit. So your first meeting, the Board members seemed fairly hawkish when you listen to—in general when you listen to what they're saying. Was there any discussion of a rate cut going forward today?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "There was one proposal on the table. There was no discussion of any other proposals. The discussion on that proposal, I would say, was quite limited. The group was unanimous and unambiguous on it. It has been the practice of this central bank and others to have a range of alternatives. Today we had one. I thought it—further discussion deepened it and made it clear what we needed to do and how we need to deliver. I wouldn't prejudge what happens in the future, but there was only one big subject for us. We took it on, we had a good family fight on it for a couple of days, and we ended up, I think, in a better place."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Claire."},
  {"type": "line", "who": "Claire Jones", "k": "guest", "text": "Thanks a lot, Claire Jones, Financial Times. You know, coming to this blind, reading this very nice, short statements that I think we've all appreciated in the room, one might wonder why you didn't raise rates today considering what you're saying here about the risks to U.S. inflation and your mandate. I guess why not and what would you need to see in order to get to that place? And secondly, on your task forces, are there any best practices of the central banks that you'd consider looking at? Thank you."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Yeah. I'm glad they're in the practice of giving you two questions, because my answer to your first question was to be very curt. I've got nothing more to say than the statement itself. And to the point of the question I got before, market reactions to what we say, \"unfiltered,\" I think is more helpful than having delivered a statement to me than improvising further upon it. Best practices of task forces, this is a subject I thought some about. I've been on a task force or two in my life. Best practice, find the best minds. Ensure that the task forces have a range of people, both by backgrounds and predispositions, so they too can have a bit of a family fight. Make sure when you establish a task force that the group that's going to be the recipient of the information feels as if they've got some equities in it, too. That's why we're looking for—haven't done the final roll call, some of the most significant talent we have in the building and across the Reserve banks on each of these, and in some sense, seconding them to this group for a period of some number of months so that the leaders of the task force know what the most analytical central bank in the world thinks about that. They can reflect on it. And a final best practice, we're not outsourcing decisions to anybody. Administrations past and present, Reserve banks have chosen a group of 19 people around the table. These will be our decisions. We can agree to some of the recommendations, disagree with others, have a good family fight about it. But what comes from them will, I hope and believe, make the discussion we have internally better, stronger, more of a dialectic so that we can finally deliver on that price stability objective."},
  {"type": "line", "who": "Claire Jones", "k": "guest", "text": "Just a quick follow up on your market's point, if you look at two-year yields, they're really suggesting that markets think more tightening is needed. Would that be your read on what the two-year yield is saying as well?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "We were in such a good place. This is why we don't do third questions, I presume. I'm not going to offer any commentary on market reaction over the last 30 or 60 minutes. What we've given markets is a new chapter for the central bank, some fresh thinking. What we've given markets, and households, and businesses, I think, is a commitment to ask ourselves hard questions, such that we can deliver on the promises that we've made before. This is a lot of change for financial markets to digest. I wouldn't be particularly intrigued by how they react in the first several minutes or even first several days. What I think is most important is that financial markets—and at least as important, households and businesses know that the central bank will deliver on price stability."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Brian."},
  {"type": "line", "who": "Brian Cheung", "k": "guest", "text": "Hi, Chairman Warsh, Brian Cheung with NBC News. Thank you for taking our questions. So, when you say that we've dropped forward guidance, for the layperson, that might sound like the Fed's going to say less or offer less insight into where their borrowing costs might go. So, for the person that maybe you might run into at the grocery store, where the price tags are rising at a faster pace than their wages at the moment, how would you explain it to them? I don't know if \"task force\" might be the answer there, but how would you kind of communicate this era, this chapter of the Fed?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "If I told somebody in the milk aisle that I had a task force for that, I think that would be doing a very poor job, so I appreciate it. If I saw somebody in the grocery store, what I would say to them is that we cannot have a very significant effect on particular prices. The price of oil in the markets today or even the price of a dozen eggs, that does not have first-order consequences to what we're doing. But we do have a really important job there, and it's make sure that those changes in oil, or beef, or eggs, or milk don't broaden in the economy, don't have second- and third-order effects. That's our job, that's our commitment, that's our capability, and we're going to deliver on it."},
  {"type": "line", "who": "Brian Cheung", "k": "guest", "text": "And then is the Fed's relationship with the Treasury also under review? There was the normal breakfast meetings with the Treasury Secretary. Is that something you intend to continue doing, and have you had conversations with the president since your swearing in?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So on the president, I don't have anything for you. With respect to the Treasury Secretary, he has been posting pictures about breakfast, so I don't think I can deny that. The long tradition at the central bank is that the Fed Chairman and the Treasury Secretary meet weekly. I think we've pulled off three of those so far. I believe he's overseas this week, so this will be the exception to the rule. I think they're very useful discussions. The central banks' objectives and our roles and responsibilities are quite delineated from the fiscal authorities. And in my view, monetary policy is independent in the conduct of what we do. But that doesn't mean we're not interested in what's happening with the fiscal authorities. The way I think about it is this central bank needs to have a wide lens but a narrower remit. We need to be quite interested in what's happening in the world. I won't be breaking any news here to suggest that I'm quite interested what's happening in the Middle East. That does have some effect on our day job. It doesn't mean it's our responsibility, but I think we're going to keep a wide lens, and my meetings with Secretary Bessent to this point have helped widen that aperture. So we're aware of things that could affect our day job, even if it isn't."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Steve."},
  {"type": "line", "who": "Steve Liesman", "k": "guest", "text": "Steve Liesman, CNBC. Mr. Chairman, thank you for taking my question. You had said in the—before you became Chairman that you thought productivity was a reason why the Federal Reserve could lower interest rates. Do you still believe that to be the case?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So, the Committee had a discussion of productivity today. AI came up. The way I thought about it before and socialized with the group is that artificial intelligence, the latest generation of general purpose technology, is perhaps as important a change in the economy and business and households that we've had in my adult lifetime. It is filled with both a huge opportunity and with risks. I take both of those very seriously. You may have heard me say before that \"AI\" is shorthand perhaps for \"American ingenuity.” That doesn't mean that it's going to be easy. That certainly doesn't mean it's not going to be disruptive. But over the long term, my conviction—and I heard quite a bit of support for this around the Committee today, the United States is a winner as we go down this. The United States is ultimately going to be better off in that. Now, to bring that back to the conduct of policy, timing, scale, speed, implications for output and employment, it's one of the things we have a task force to do."},
  {"type": "line", "who": "Steve Liesman", "k": "guest", "text": "If you don't mind a follow-up from the other side, which is that when you look at the strong job growth that's out there, the elevated inflation, GDP seems to be going pretty good and the stock market seems to be soaring, do you look around this economy and see the funds rate being restrictive?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So that's your second question. I'm going to give the same answer that I gave before. I'd say as I think about the conduct of policy, what matters is what's the effect of policy, not what do we say, but what happens. And the best way I can describe is it's uneven. I do see some restrictedness on things like housing. It's hard to use those same words anywhere else. I'll just make one other point. You talked about one of our dual mandates and the employment side. I don't believe that we have a cruel choice. I don't share the view that was expressed a few generations ago that Federal Reserve chairmen show up a podium like this and say, \"You've got to choose. And you're going to have to decide whether you're willing to tolerate higher inflation to put more people at work.\" I don't believe in that. What I believe is if we do our job, we can make strong growth, low prices, and strong employment mutually compatible. And so what you heard from the committee today is we've got some work to do on this price stability front."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Nick."},
  {"type": "line", "who": "Nick Timiraos", "k": "guest", "text": "Thank you, Nick Timiraos with Wall Street Journal. Chairman Warsh, you've said repeatedly credibility is earned by delivering. If credibility requires delivering, the move would be to tie it or at least to thread in two. Now, you didn't do that today. Why not?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "That judgment you expressed was not expressed by any of the 19 people around the table. We'll be meeting in six weeks and we'll take up the issue again."},
  {"type": "line", "who": "Nick Timiraos", "k": "guest", "text": "And if I could ask about AI, the buildout is generating enormous demand right now, CapEx, data centers, power. The productivity payoff may be further out. So in your judgment today, is AI adding more to demand or to supply?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "It's a good question. At the central bank in an economics profession, what we spend most of our time doing is counting demand. It's easier. We can see it, we can count it, we can check it, we can revise it. What we do, though, is we infer supply. You'll notice in the second paragraph of what one of your colleagues described as, \"A very short statement,\" we have a sentence on the demand side and a sentence about the same length on the supply side. They're both important. Just because we can count one better than the other doesn't mean we're going to favor one more than the other. With respect to AI and the growth of data centers and infrastructure around it, we're counting the demand side, and it is no doubt showing up in GDP figures. We can be less certain when we infer the timing and extent of the growth on the supply side. It may well be an intuition the supply side is going to expand, but it'll take longer, but just describe it this way. There's a race between supply and demand. Milton Friedman says that the only thing we know about economics is that there's a supply line and a demand line and they ultimately cross. When they cross, what are the implications for policy? The good news for you is we have a task force for that."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Andrew."},
  {"type": "line", "who": "Andrew Ackerman", "k": "guest", "text": "Thanks, Mr. Chairman. It sounded like on the task force on data that you were looking at overhauling or completely overhauling the system of national accounts the way that government mines the economy, is that your ambition?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "In a word, no. In a few words, much of this data gathering happens in other government agencies to which we owe a tremendous amount of respect for this, a tremendous amount of deference. But if in the course of this we come up with recommendations, which Fed staff have already begun to develop about things that they could be doing to help inform us as policymakers, we're not going to hesitate. Again, I don't want to try to delineate the four corners of the research of the task force on data, but I do think there will be a review of official statistics, and at least as important, a view of bringing the best practices from the private sector and new analytical tools made possible by AI, so we can forge these into a fabric that gives us better real-time information. So as I mentioned before, when we're making decisions, we're making decisions that we'd say are real contemporaneous data, not data that we call \"contemporaneous,\" it's really an echo of history."},
  {"type": "line", "who": "Andrew Ackerman", "k": "guest", "text": "Okay, thanks. The other question I wanted to ask is related to the building renovations. Are you considering any changes to the renovations, the projects, just in light of the fact that they became kind of a political football in the last year?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "I heard something about that. I don't think I'm breaking any news, but my views when you show up at a new institution, you should go meet with the inspector general, just as a matter of good practice. It's a practice that I hope to continue. I've had one meeting with the inspector general and he told me what I believe the world knows, which he'll be coming out with a report on the building and the building projects at some point later this summer, and I'll be interested in reading the report. From my perspective, with a forward-looking glance, is there anything that we can be doing or should be doing from this moment until the completion of the project to do what we can to be good stewards of taxpayer money and make sure that we're delivering on the promises that we made, so more work to do. You might not be surprised, in the first few weeks I've been somewhat preoccupied on other matters, but I promise to get to the full breadth of the Fed's tasks in the weeks ahead."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Victoria."},
  {"type": "line", "who": "Victoria Guida", "k": "guest", "text": "Hi, Victoria Guida with Politico. So I know that you did not submit a forecast, but you are the person who is authorized to speak on behalf of the FOMC. So I'm wondering if you could tell us in the SEP the increase in the expectations for inflation, is that all because of the Iran war? What was the discussion around the expectations for inflation being higher and also potentially growth being slower?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "So my read of what I heard in the room reflected, I must admit, in the SEPs, is half of my colleagues thought the policy rate, given all those developments, should be at this level or lower between now and yearend and the other half thought higher. That 19th voter was me, and I didn't submit one. There’s a range of views on the questions of firstand second-round effects, no resolution or conviction. But we'll be meeting again in six weeks. I think we're going to know more then. And I think that my colleagues are very attentive to incoming developments between now and then."},
  {"type": "line", "who": "Victoria Guida", "k": "guest", "text": "And can I just quick follow-up on the SEP?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Sure."},
  {"type": "line", "who": "Victoria Guida", "k": "guest", "text": "You said that you're still encouraging your fellow committee members to submit forecasts, even if you're not doing it. So what do you think is the benefit of them doing it if you don't?"},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "That's the commitment that the FOMC made, and it's a commitment that I hope we live up to. Commitment we made was to deliver price stability. I expect us to live up to it. By the time that we get to the end of this year, as I mentioned, I wouldn't be surprised if there was a new communications framework, there were some changes to the SEP. That's a committee discussion, a robust discussion, and I think we'll have it. I believe we're going to come to a better mix of communications to deliver on what we promised. But I don't want to prejudge what those are, but between now and then I would continue to expect colleagues to submit their SEPs. Some of them I think believe that the practice as currently structured is okay. But I heard a lot of interest in real reform, generally about all of these topics. You didn't ask it, but I'll answer. It was a pretty gracious couple of days and it's been a pretty warm few weeks. The institution wants to figure out how we can do better. The institution's going back to first principles. And I'm encouraged that what we've done in the statement, what we're thinking about doing with respect to the SEP, that instinct towards a new chapter is a real one, and by the end of the year, I hope we can put some points on the board both in form and in substance of delivering."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Go to Enda with the last question."},
  {"type": "line", "who": "Enda Curran", "k": "guest", "text": "Thank you, Mr. Chairman, Enda Curran, Bloomberg News. Could you guide us through, please, some of the principles that guide your own reaction function, and tell us a little bit about conditions that you think when the Fed should respond."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "It's going to be a very unsatisfactory answer to the final question. The Federal Reserve has a lot of responsibilities, not just in monetary policy, but in supervision and regulation, consumer affairs and payments. My own view is our credibility comes from delivering on what we're saying we're going to do across everything we do. I've devoted more time in my first three weeks to monetary policy than all those things. But the more we deliver on our promises as good supervisors and good regulators, the more benefit we get, the more credibility enhancement we have in monetary policy. When we deliver on our price stability objectives, which we will, the American people will feel as though the hardships that they have been living through, in part because of inflation in the last five years, are in the rearview mirror, and that credibility will have dividends across what we do, and the institution will come to press conferences like this always with an impetus to reform, always with an impetus to do better, but we're going to put some points on the board."},
  {"type": "line", "who": "Enda Curran", "k": "guest", "text": "With the [inaudible] labor data in recent months, how would you sum up labor data—labor market right now, do you see it as stable, as a potentially source of inflation? Thank you."},
  {"type": "line", "who": "Chairman Warsh", "k": "host", "text": "Yeah. So the committee—if I were to try to capture how the committee thought about it, the committee thought that the labor markets were stable. There were some people around the committee who thought that it was trending better than that. Trends matter more than data points. What's happening over three or six months matters more than any one data point, any one data release. And I'd say the jobs data has been moving in a good direction. If I heard one other thing around that subject over the course of the last couple of days, what I heard was that strong productivity-led growth is not something that we fear, but something we embrace. Thank you all very much."},
];
const FOMC_POWELL = [
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Good afternoon. My colleagues and I remain squarely focused on achieving our dual-mandate goals of maximum employment and stable prices for the benefit of the American people. The U.S. economy has been expanding at a solid pace. While job gains have remained low, the unemployment rate has been little changed in recent months. Inflation has moved up and is elevated, in part reflecting the recent increase in global energy prices. Today, the FOMC decided to leave our policy rate unchanged. We see the current stance of monetary policy as appropriate to promote progress toward our maximum-employment and 2 percent inflation goals. Developments in the Middle East are contributing to a high level of uncertainty about the economic outlook, and we will remain attentive to risks to both sides of our dual mandate. I'll have more to say about monetary policy after briefly reviewing economic developments. Recent indicators suggest that economic activity has been expanding at a solid pace. Consumer spending has been resilient, and business fixed investment has continued to expand at a brisk pace. In contrast, activity in the housing sector has remained weak. In the labor market, the unemployment rate was 4.3 percent in March and has changed little in recent months. Job gains have remained low. A good part of the slowing in the pace of the job growth over the past year reflects a decline in the growth of the labor force due to lower immigration and labor force participation, though labor demand has clearly softened as well. Other indicators, including job openings, layoffs, hiring, and nominal wage growth, generally show little change in recent months. Inflation has moved up recently and is elevated relative to our 2 percent longer-run goal. Estimates based on the consumer price index and other data indicate that total PCE prices rose 3.5 percent over the 12 months ending in March, boosted by the significant rise in global oil prices that has resulted from the conflict in the Middle East. Excluding the volatile food and energy categories, core PCE prices rose 3.2 percent over the 12 months ending in March. This relatively high rate largely reflects the effects of tariffs on prices in the goods sector. Near-term measures of inflation expectations have risen this year, likely because of the substantial rise in oil prices. Most measures of longer-term expectations remain consistent with our 2 percent inflation goal. Our monetary policy actions are guided by our dual mandate to promote maximum employment and stable prices for the American people. At today's meeting, the Committee decided to maintain the target range for the federal funds rate at 3½ to 3¾ percent. The economic outlook remains highly uncertain, and the conflict in the Middle East has added to this uncertainty. In the near term, higher energy prices will push up overall inflation. Beyond that, the scope and duration of potential effects on the economy remain unclear, as does the future course of the conflict itself. We will continue to monitor the risks to both sides of our dual mandate. We are well positioned to determine the extent and timing of additional adjustments to our policy rate based on the incoming data, the evolving outlook, and the balance of risks. Monetary policy is not on a preset course, and we will make our decisions on a meeting-by-meeting basis. This is my last press conference as Chair, and I will close with a few thoughts. First, I want to congratulate Kevin Warsh on his advancement out of the Senate Banking Committee this morning. This is an important step forward, and I wish him well as that process continues. The Federal Reserve exists for one fundamental purpose: to foster the economic conditions in which American families and businesses can thrive—stable prices, a strong job market, and a financial system they can depend on. Every decision we make—whether about interest rates, or regulatory and supervisory matters, or other issues—is made in service of that purpose. Our decisions reflect the collective judgment of the Board of Governors and the Federal Open Market Committee—colleagues who demonstrate analytical rigor, principled judgment, and a genuine commitment to the public interest. Our collaborative and deliberative process has long reflected a shared commitment to finding common ground in service to our mission. This institution is resilient, capable, and staffed by professionals of extraordinary talent and exceptional dedication. It has been a privilege to serve alongside so many great public servants at the Board of Governors and around the Federal Reserve System. The Fed's work is only as effective as the public's understanding of it, and you, the press, are essential to keeping the public informed about what we do and why. The people we serve benefit from your careful reporting. I welcomed the announcement last Friday by the U.S. Attorney for the District of Columbia that she had closed the criminal investigation. She also noted, however, that she would not hesitate to restart the investigation. Over the weekend, the Department of Justice provided assurances that they will not reopen the investigation unless there is a criminal referral from the Fed's Inspector General. And, absent such a referral, if they do appeal the recent court decision, they would not seek as part of that appeal to restart the investigation or send new subpoenas. I have said that I will not leave the Board until this investigation is well and truly over, with transparency and finality, and I stand by that. I'm encouraged by recent developments, and I'm watching the remaining steps in this process carefully. My decisions on these matters will continue to be guided entirely by what I believe is in the best interest of the institution and the people we serve. After my term as Chair ends on May 15, I will continue to serve as a Governor for a period of time to be determined. I plan to keep a low profile as a Governor. There is only ever one Chair of the Federal Reserve Board. When Kevin Warsh is confirmed and sworn in, he will be that Chair. Once sworn in as Board Chair, his new colleagues will elect him to chair the FOMC as well. As I regularly point out from this podium, our success in delivering on our goals matters for all Americans. I am confident that the Fed will continue to do its work with objectivity, integrity, and a deep commitment to serve the American people. Thank you, and I look forward to your questions."},
  {"type": "line", "who": "Steve Liesman", "k": "guest", "text": "Thank you, Mr. Chair. I appreciate the kind words about the press—often doesn't come from the podium in different places, but appreciate that. Can you talk about what has gone into your decision to remain on the Board? What kind of criteria are you weighing, and how long might you stay? Thank you."},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Sure. So, you know, my concern is really about the series of legal attacks on the Fed which threaten our ability to conduct monetary policy without considering political factors. And I want to note here this has nothing whatever to do with verbal criticism by elected officials. I've never suggested that such verbal criticism is a problem, and neither has anyone else here. But these legal actions by the Administration are unprecedented in our 113-year history, and there are ongoing threats of additional such actions. I worry that these attacks are battering the institution and putting at risk the thing that really matters to the public—which is the ability to conduct monetary policy without taking into consideration political factors. It is so important for our economy, for the people that we serve, that they can depend over time on a central bank that operates that way, free of political influence. It's part of the absolute foundation of this amazing economy that we have. It's just one of the many reasons why the U.S. economy is the envy of the world. That piece of institutional architecture separates successful countries from unsuccessful countries. It is extremely important—not for the people who work at the Fed at any given time, but for the people that we serve—that the Fed remain able to conduct monetary policy in a way that doesn't get pulled into politics, trying to help or hurt any particular politician or political party. It's critical for the people that we serve. In terms of when I would leave, I will leave when I think it's appropriate to do so. Was that all your questions?"},
  {"type": "line", "who": "Steve Liesman", "k": "guest", "text": "Well, I just have a follow-up, which is, what would you say to the criticism that by remaining on the Board, you're actually taking a political act and denying President Trump the majority of the Board, which, as President, he would have if you left?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I don't see that at all. As I mentioned, you know, I'm literally staying because of the actions that have been taken. I had long planned to be retiring. And, you know, the things that have happened, really, in the last three months have, I think, left me no choice but to stay until I see them through at least that long. You know, in addition, I don't see how this will interfere. My intention is not to interfere. You know, I was a Governor for almost six years, and the tradition is, at the Fed, that Governors who understand how difficult the role of Chair is—and as a soon-to-be former Chair, I do understand how hard it is to get consensus with 19 strong-minded people—you work with the Chair, you try to be heard, but also collaborate with the Chair and try to support the Chair when you can. When you can't, you can't. And I think that's the attitude that people generally take. And that's the attitude that I'll take."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Nick."},
  {"type": "line", "who": "Nick Timiraos", "k": "guest", "text": "Chair Powell, if I could ask about the inflation outlook. In March, you described the standard practice of \"looking through\" energy shocks as conditional on inflation expectations staying anchored. Since that meeting, there has been very little progress reopening key energy trade corridors. Can you help us understand how the inflation outlook has changed in the intermeeting period, beginning with the prospects for tariff pass-through resolving on the timeline that you had outlined in March, before getting to the energy shock that is now on top?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So, you know, I would look at it this way. For a long time, we've been working on the hypothesis, really, that tariff, tariffs would lead to a one-time price increase and that that would go away over time—in other words, that there would be no further change, so measured inflation wouldn't reflect that higher level, going up more and more. And it's time for that to happen. You know, we really do expect that to be happening in the next two quarters. So we'll be watching very carefully to see that what we've thought all along would happen. That's the kind of critical part of the forecast. We need to really see that. With, with energy, it's so hard to say. I mentioned, you know, in, you know, sort of the textbook [analysis], you would \"look through\" an oil shock because they tend to be short lived and they tend to revert. And monetary policy works with long and variable lags, so, you know, you wouldn't necessarily react right away. I think that is all the more true, given that we're several years above 2 percent inflation, and that we're already \"looking through\" the tariff shock. So I think we're going to be very cautious about that. It's—but the, you know, the question about looking through energy really is not in front of us right now. It hasn't even peaked yet. And I think we'd want to see the back side of that and progress on tariffs before we even thought about, about reducing rates."},
  {"type": "line", "who": "Nick Timiraos", "k": "guest", "text": "So if I could follow up: The statement today preserves language that has taken on some meaning, as it was socialized when the Committee was actively lowering rates. Why is that easing bias still ripe, given how different the inflation outlook is now versus a meeting or two ago? And what more would have to happen for it to get evicted?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So that was—as you will recall, we had a discussion about that at the last meeting, and we talked about it in the press conference after the March meeting. We had the same today. We had quite a vigorous discussion about that very issue and the guidance and \"is it still appropriate\" and that kind of thing. And I would say that the, you know, number of people on the Committee who either could support that language change changing to a more neutral stance so that the hike is as likely as a cut—that number has increased over the intermeeting period. And it's easy to see why. I mean, it's, it's a good question, right? You see inflation has moved up over the interim a bit—core inflation's 3.2 [percent] now—moving albeit just a little bit in the wrong direction. And we know that there will be, you know, that there's headline inflation coming out of the Gulf and we don't know how much that will be, we just—we're going to need to see. So it makes all the sense in the world that people would look at that and we'd have a vigorous discussion about that. You saw that three people dissented over the language. I think all of those people agreed with the rate decision. So the majority of the Committee did not want to do that. And, and I was—I didn't think we needed to do it at this meeting. It really was just a question of what's—why do we need to do that now? You know, we have so much to learn, there's so much uncertainty about the path ahead, there doesn't need to be any rush to make that decision now because, you know, what happens in the next 30, 60 days, even by the next meeting, could really change the picture around that—around that language. So, you know, it was a—it's a close—it's a much closer thing on the Committee than it was in March. And, you know, that makes all the sense in the world, it seems to me."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Claire."},
  {"type": "line", "who": "Claire Jones", "k": "guest", "text": "Claire Jones, Financial Times. Just going back to this issue of the easing bias: We've now got oil approaching $120 a barrel when it comes to the benchmark Brent crude. If it stays around those levels six weeks from now, what would be your guess—best guess as to whether the easing bias will still be in the statement? Thank you."},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I wouldn't want to guess. You know—well, first of all, we're going to have new leadership, in all likelihood, by then. And new leadership is going to have a very important role to play in that, so I won't be standing here at this podium to answer your questions. I don't know. As I mentioned, that's all I can really say is that we had a great discussion about that today. It's a—you know, it's got—it's gotten to be a better question in the interim period. We had the discussion. A majority are still on the page of not feeling the need to move to that level. And I—that's where I am. I get it, though. You know, at a certain point, you would move. And that, that conceivably could come as soon as the next meeting."},
  {"type": "line", "who": "Claire Jones", "k": "guest", "text": "Thank you. Just a follow-up. The new leadership also seem rather lukewarm on press conferences and on the dot plots. What would your advice to him be on these communication tools?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So I'm not going to give him any advice through you today here. But I've—you know, I think communications generally is—I think every incoming Chair takes a look at communications, and it's a very healthy thing. I mean, communications is—it's very complex, and, you know, you can always be looking at new things. And if that happens—it feels like it's going to happen—that's a completely appropriate thing."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Neil."},
  {"type": "line", "who": "Neil Irwin", "k": "guest", "text": "Hi, Chair, Chair Powell. Neil Irwin with Axios. Can you tell us if you've been in touch with incoming Chairman Warsh? To what extent is this a normal transition process versus all the things swirling around something unusual, and what can we expect when he takes, takes that podium in a few weeks?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I haven't seen him since seeing him at a dinner in January, where I congratulated him and had a nice chat with him. Haven't seen him. I don't know what a normal process is. You know, the last process was with Janet Yellen, with whom I had worked for six years. And so it was—you know, we were sitting down the hall from each other, so it was a very different thing. I think this is and will be a very normal, standard kind of a—kind of a transition process. So that's what I expect. I have every reason to think it will be."},
  {"type": "line", "who": "Neil Irwin", "k": "guest", "text": "Quick follow-up. Is the Supreme Court ruling on Governor Cook a factor in when you may leave as a Governor?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I wasn't thinking of it as such. But, no, not really. I mean, I'm thinking more of the other things I mentioned."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Chris."},
  {"type": "line", "who": "Chris Rugaber", "k": "guest", "text": "Hi. Thanks for taking our question. I wanted to ask a question about your tenure—and Chris Rugaber at Associated Press. During your tenure as Chair, you often spoke about how disadvantaged Americans benefited from extended periods of low unemployment. And the new framework the Fed adopted in 2020, some economists say, elevated the Fed's employment mandate. Are you worried that the pandemic inflation spike that followed will make future Fed Chairs more reluctant to pursue a \"hot\" jobs market? And should they be?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I don't know the answer to that. I mean, what we—so what we experienced in, in the teens—the mid-teens was really low levels of unemployment for a long period of time and no reaction from inflation. Now, we all took—very much took notice of that. We also noticed that the biggest wage gains were going to people at the bottom end of the income spectrum. And we had many, many reports of—I mean, it felt like a fairly stable equilibrium. And a lot of benefits were flowing to people at the bottom end of the income spectrum, including companies were, you know, setting up in, in, you know—people who were confined and, like, training them before they got out. And it was a—it was a very healthy sort of set of societal dynamics. So, of course, I think anybody would love to get back to that. I don't think that anything that happened to create the global pandemic inflation was in any way related to overweighting the employment market. I mean, it was a global shock that happened essentially very, very similarly all over the world [and] that had to do with closing and reopening, stimulus, and all that. And, I mean, you could look at a graph of 10 big economies on the page and not know which was the U.S. and which was Germany, France, and things like that. So I don't think that that insight was in any way responsible for the high inflation that we experienced. So, I mean, I think it's always been a balance. You've got to—you've got to be strong on both of our dual mandates. And we just—for example, now we don't feel that the labor market is at all a source of inflation, so we don't need to be worrying about that. It's been a long time since we have had to worry about that. Well, actually, during the pandemic recovery, the labor market was super overheated and tight, and that's when we had to worry about it. But not now."},
  {"type": "line", "who": "Chris Rugaber", "k": "guest", "text": "Just on the other issue, are you—would you need—do you need more assurance from the Justice Department before stepping down? Is that what you're waiting for, or what else is going to affect—"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I'm waiting, you know, for the investigation to be well and truly over with finality and transparency. I'm waiting for that. And I will leave when I think it's appropriate to do so."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Michael McKee."},
  {"type": "line", "who": "Michael McKee", "k": "guest", "text": "Michael McKee from Bloomberg Television and Radio. I'd like to ask you, if you could, explain a little more or characterize a little more the discussion about the two-sided view and interest rates, because there were some members of the Open Market Committee who've been suggesting that we may need to raise interest rates even absent the war because inflation was not coming down fast enough. Is there any sense that interest rates might have to go up, or was this just a set-up to sort of warn people that you're worried about the war impacts?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So nobody—the three dissenters and others who could have supported that and others who were, you know, who were voters and prefer—nonvoters who preferred it, they all supported the rate decision, right? So people are not saying we need to hike now. It's more a question of, you know, don't we kind of feel that we should be neutral? And markets are—markets—what are markets doing? People argue that this is consistent with markets are doing. And, again, it's a very fair question. But, you know, these changes, there is—you know, it's a form of forward guidance. And you want to make—you don't want to make them—you want to make them in a way that will be sustained and continue to make sense and not something you need to take back, you know, fairly quickly. So I think we just—a group of us, including me, didn't feel like we needed to be in a hurry on that, that markets are not confused about our reaction function. We don't have a problem to solve on that. But the other side of the argument is a good argument, too, as I mentioned. It's a perfectly good argument to be having, good discussion to be having, so. And it came out the way it came out."},
  {"type": "line", "who": "Michael McKee", "k": "guest", "text": "Well, you've got three dissents in favor of a two-sided warning. You've got yourself staying on the Board. You've got the criticism that does come from elected officials. And you've got a lot of critics who have faulted the Fed for being too slow—2021—with inflation. Are you worried about Fed credibility under all of this? Is that one reason that you want to stay on?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Not driving my thinking now. I mean, monetary policy is going to get made by, you know, 19 people. There's a lot of stability there. I mean, if you think about it, any—every new Fed Chair has the same situation, which is you've got 18 colleagues on the FOMC, 11 of them vote during any year, and you have to—your job is to create consensus. It's to talk to them, understand them, you know, be inside their thinking, and be able to pull them together and get consensus and move. And that's what every Fed Chair has to do. And I think Kevin Warsh is actually quite well—he has the capabilities, skills to be very good at that, I would think. So I think—I'm not so worried about that process. You know, I think that'll work itself out."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Howard."},
  {"type": "line", "who": "Howard Schneider", "k": "guest", "text": "Thank you, Chair Powell. Howard Schneider with Reuters. You mentioned that, staying on as a Governor, you intend to keep a low profile. I'm just wondering if you could give us a little more detail on what that looks like and how you can—[Laughter] Touché. What that—yeah, walk down the steps—what that looks like. And, particularly around the policy discussion, how you're able to have your intervention and not be a \"shadow Chair\" and not have kind of an outsized influence over the process."},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Yeah. You know, that's just something I would never do—you know, the \"shadow Chair\" thing. No. You know, I—it's—I don't know what the exact specifics of it will be, but I'm going back to being a Governor. I respect the role of Chair. You know, I was a Chair—I was a Governor for six years, and I know what that's like. I know what—and I had a, you know, pretty front row seat, particularly with Chair Yellen, to whom I was close. I, I worked with Chairman Bernanke for two years, but, you know, I was brand new at that time. So I got a sense of what it was. And I had real sympathy for how hard it is to get that group to consensus. And I always felt like I—you know, I don't want to add to that unnecessarily. And that means try to support the Chairs where the Chair—the direction the Chair wants to go, if you can. If you can't, you can't. But—and I think that's the way it's always worked there because the Chair only has one vote plus the ability to develop consensus. And if people won't be, you know, they won't—if they're not flexible at all, then how do you ever do that? And so that's why the Chair has the authority, the Chair has, really, is to develop relationships with people and work with them, and then—and then put something forward that has consensus. And I, you know, I propose to be a very constructive participant in that process, really out of respect for the office of the Chair."},
  {"type": "line", "who": "Howard Schneider", "k": "guest", "text": "And in your view as a soon-to-be Governor, how do you see the risks of oil prices bleeding into core inflation in coming weeks? Because that was—it seems like the commentary that was coming from particularly some of the Reserve Bank presidents, there were elevated concerns about the bleed into core, and, you know, here we are with three dissents now. What do you see as the prospect of a core inflation problem?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, those prospects are real. Remember, though, our—they're real. And the real thing is we're going to have to wait and see. We're going to need to see. And the good news is we think our policy stance is just—is in a very good place for us to wait and see. We, you know, we're right kind of at the high end of neutral or perhaps mildly restrictive. The labor market shows more and more signs of stability, whereas inflation is kind of misbehaving. And so maybe a little bit of restriction or the high end of neutral is just the right place to be. So we can wait here and see—and see how things work out before we act. And we'll see how much that—you know, how much does come through into core. You see it already in airfares, of course. But you may see it in many other places. You know, we just don't know yet. And it's so unknowable, because how long will the Strait be closed? You can develop any number of scenarios that you want, but we really won't know till we know. So, fortunately, we're in a good place to wait and let things develop."},
  {"type": "line", "who": "Howard Schneider", "k": "guest", "text": "Thank you."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Andrew."},
  {"type": "line", "who": "Andrew Ackerman", "k": "guest", "text": "Thanks, Mr. Chairman. You started holding postmeeting press conferences for every meeting as opposed to the ones with just—with SEPs. Can you talk about why you see that as a net positive?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So we, we always said—when we were doing quarterly press conferences, we always said \"we can move at any meeting\"—but we only ever moved at the quarterly SEP meetings where we had the press conference. So if you think about it, you know, we—during the pandemic, we were moving, like, a lot at every meeting and sometimes between meetings. And doing that without a press conference, I think, would have been quite challenging. It's become the industry norm. It's the standard. I don't know whether that has to remain that way. I don't know. I mean, I—it's just something people have become used to. And I do think it's quite helpful to, you know, to—I mean, I try to deliver a message on behalf of the Committee rather than 18 people—18 other people going out and delivering their message. And it's, you know, it's going to be all over the place because we do, thankfully, have widely disparate views."},
  {"type": "line", "who": "Andrew Ackerman", "k": "guest", "text": "Okay, thanks. The other thing I wanted to ask about was the communications review from last year. Could you describe the debate last year, what changes were considered, what you wanted, and what prevented action—any action on the—on those changes?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So I'm not going to go into the real small specifics. But what we found very quickly was that making, making changes—making really large changes, for example, to the dot plot or the SEP, it didn't have—we couldn't come up with anything that had really broad support on the Committee. And so we just moved on. We didn't—we didn't really do as much on that as we might have. And, you know, I was never the world's biggest fan of the dot plot, but you can't—you can't beat something with nothing. And, you know, there's a—that we've looked at a bunch of things and, you know, it's something, like I said, I think every new Chair is going to look at our suite of communications and think about what would be changes. We are the only major central bank that doesn't publish a forecast. And that's because we have a 19-person Committee, and, you know, you try to do it—you try to do that at the Board, that's hard—at the Committee, that's hard. It's hard if you do it at the staff. So it's, you know, it's been—it works. I think our communications are fine, but looking at doing it in a different and better way is the most natural thing in the world."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Colby."},
  {"type": "line", "who": "Colby Smith", "k": "guest", "text": "Thank you. Colby Smith with the New York Times. If I could follow up on Mike's question about hikes, are we right to assume that the hawkish outcome for the Fed is still one in which the Committee just extends the pause in rate cuts? And to what extent is there a growing sense within the Committee that monetary policy really isn't just restrictive at all right now? The economy is holding up relatively well despite this major energy shock, the unemployment rate has ticked lower, inflation was moving sideways even before the war and is now moving higher. So where is the Committee at on that debate?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, where we're at is we think our—really, we think our policy rate is in a good place. If we need to hike, we will certainly signal that, and we will—and we will certainly do it. And if we need to cut, then—or if it's appropriate to cut, then we'll signal the opposite. I think we—because we feel like we're in a good place to move in either direction, nobody's calling for a hike right now. So it really is going to depend on how things—how things evolve. And, you know, that's really where it is. And, as I mentioned, you know, much closer question this cycle on changing the guidance, but, ultimately, we didn't."},
  {"type": "line", "who": "Colby Smith", "k": "guest", "text": "And, as it relates to the war, at what point do you think the risk to growth will be larger than the risk to inflation as this conflict drags on?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, you just have to find that out empirically. You know, with—given our—the fact that we're, you know, a big exporter of energy and that our economy is far less energy intensive, oil intensive, than it was during the '70s, you know, the effects on the United States are really substantially less than those of Western Europe or Asia. We're feeling much greater effects from these things—the effects we're feeling in, you know, in the current situation currently and in sort of what's priced in, which is, you know, a relatively quick outcome. If this goes on for much longer and prices go much higher, then we'll feel that much more. And, of course, I'm talking about aggregate inflation numbers. We know—we're very well aware that people are experiencing higher gas prices all over the country now. And that hurts. That's—and these are—those hikes may continue to happen. And other things are going to start to reflect—airline fares I've mentioned and other products and services that are dependent upon petroleum and derivatives of petroleum. People are going to start to feel that."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Edward."},
  {"type": "line", "who": "Edward Lawrence", "k": "guest", "text": "Thank you. Thank you, Chair Powell. Edward Lawrence with Fox Business. So I guess I'll just ask you directly on this. The markets don't see a rate cut at all this year—is what they're predicting. Do you think that we are at the neutral rate? Why or why not?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, the neutral rate is a—we cannot know it with, with certainty. I think pretty close to the neutral rate, yeah. I always had it, you know, between 3 and 4 percent. We're a little north of 3½ [percent], so that's well in the range of what I would consider reasonable, but at the higher end of the range of what I would consider reasonable neutral rate. You know, I think you're—the labor market is still probably cooling off just a little bit. And I don't think there's much of a case for—any case, really—for, for policy looking, you know, meaningfully restrictive. Maybe mildly restrictive or neutral, I would say."},
  {"type": "line", "who": "Edward Lawrence", "k": "guest", "text": "And I want to follow up on some of the other questions about your future a little bit. The first time we've seen four dissents now since October of 1992. Are you handing off a divided Fed?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, the thing to remember is we have always had vigorous debates, and they're excellent debates. I have to say, they're—they've been really good. And we're in an unusually difficult situation. So we've really had four supply shocks. You can—actually, you can say more than four, but, at a minimum, we've—we had the pandemic, we had the invasion of Ukraine, we had tariffs, and now we have Iran and the oil, you know, the oil spike. So those—every, every supply shock has the capability of, right, driving inflation up and unemployment up. And what do you do? You know, you're—it's—the central bank has a really hard time knowing what to do. So the right thing to do is to try to balance the achievement of those two goals, and that's what our framework calls for us to do. But these are really tough, difficult judgments. You've got to have a forecast for each variable. You've got to think how long it's going to take to get back to target. You've got to think how restrictive or not is policy. So it's only natural that you have a range of views on the Committee. You know, people are going to see it different ways, they're going to have different risk tolerances and that kind of thing. I mean, if everybody agreed, that would be—that would be surprising. And I think it's only—it's partly a function of the extraordinarily challenging set of supply shocks that we've been dealing with now for five, six years."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Selina."},
  {"type": "line", "who": "Selina Wang", "k": "guest", "text": "Thank you so much, Chair Powell. Selina Wang with ABC News. Are you confident that Kevin Warsh will stand up to political pressure from President Trump?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So he testified very strongly to that effect in his hearing, and I'll take him at his word."},
  {"type": "line", "who": "Selina Wang", "k": "guest", "text": "And when it comes to gas, right now it's over $4 a gallon. Inflation just hit a two-year high. Should Americans expect to be paying higher gas prices for the rest of this year? And, in your view, does that take a rate cut off of the table? And, secondly, by staying on as Fed Governor, what message do you think you're sending to the President?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I don't know what gas prices are going to do for the rest of the year. And it will depend on how long the Strait remains closed and how quickly it can be reopened and that kind of thing. But, remember, when gas prices go up, that's disposable income coming out of people's pockets, so they're going to spend less on other things. So there will be a hit to GDP. So it's a, you know, it's a question whether spending, you know, goes down to offset the inflationary effects. So it's not—the answer isn't obvious ex ante whether you—whether you should move your rate over because of that. We'll have to see how it evolves."},
  {"type": "line", "who": "Selina Wang", "k": "guest", "text": "And the message it sends to President Trump by staying on?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I'll stand on what I said earlier."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Victoria."},
  {"type": "line", "who": "Victoria Guida", "k": "guest", "text": "Hi. Victoria Guida with Politico. During your tenure, Fed independence has come under pressure in a lot of different ways. And I was just wondering, practically speaking, where do you see Fed independence as coming from? Is it the law? Is it political support from Congress? Is it the actions of the Fed? What sustains Fed independence?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Well, it's, you know, it's—to a significant extent, it is the law. And, you know, we've had to go to court to—successfully, so far—to defend it. But, you know, the law does create a setting in which the Fed can and is directed to make monetary policy without consideration of political factors. And so part of it is the law. But it goes beyond that, though. There's a set of customs. There's a boundary line between the Fed and the Administration, between the Fed and the Treasury Department. And we need to respect those—continue to respect those boundaries about what the Fed is responsible for and what the Treasury is responsible for and what the rest of the Administration's responsible. So some of it is legal. In fact, it's all legal at the end of the day. But there—it's more than just monetary policy. We, you know, we don't—we don't want to use our tools to—we haven't wanted to use our tools to achieve goals that are really clearly outside our mandate. Every Administration looks at our tools and thinks that would be good to repurpose those to serve other purposes, but that gets dragged—that's dragging us into politics and into fiscal policy. So we've resisted that."},
  {"type": "line", "who": "Victoria Guida", "k": "guest", "text": "Well, and maybe another way of asking it, too, is, do you think that Fed independence is as strong now as when you became Chair? And, if so, why?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Look, I think it's at risk. I mean, I think these, these you know, these legal assaults, if you will—as I mentioned, you know, the institution is being battered over these things. We're having to resort to, you know, the courts to, to enforce our legal, you know, it's not so much independence, it's really the ability to do monetary—to make monetary policy without political considerations. That's what we're talking about. And we've had to do that, and we've been successful so far, but that's not over. None of that is concluded yet. And it's, you know, it's really important. It's not about—it's not about people who work at the Fed or the institution—it's about the benefits of a central bank that makes decisions based on analysis and our best thinking rather than, you know, trying to help or hurt politicians. It's, you know—there's a bright line between central banks who do one and do the other. And successful countries have uniformly—successful, advanced-economy countries have a really strong set of protections around their central bank just for that reason. So that's what it's all about. You know, I think—I am confident, as I said in my remarks, that the Fed will continue to make its decision based on analysis—rigorous analysis—and not on political considerations, but we've had to fight for it. And I, you know, I'd like to think that—you know, I'd like to think we can get out of that era and go back to respecting, you know, what the law says and what custom has been, which is to, you know, let the Fed do our thing. We're, you know, we're not—we're—it's a—it's an institution full of human beings who work super hard to get things right for the benefit of the public. We're all human. Don't expect perfection. But do expect us to make, you know, decisions without political considerations and the very best analysis we can bring."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Catarina."},
  {"type": "line", "who": "Catarina Saraiva", "k": "guest", "text": "Catarina Saraiva, Bloomberg News. How do you characterize what you've heard from your colleagues on your decision to stay? Do you have their support? And then have you heard concern from your colleagues about continued legal attacks from the executive branch? Is this something that others have, you know, talked to you about?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So I think that—I don't want to report on what my colleagues think. They can—they can speak for themselves. But, you know, yeah, there are—there are widespread concerns that these things may continue. That's all—that's all I'll say. And, you know, and that would be a problem."},
  {"type": "line", "who": "Catarina Saraiva", "k": "guest", "text": "And then I just also wanted to ask about Governor Waller's speech on the Reserve Banks. What, you know—do you have any thoughts on centralizing some of those functions in the way he described? And then have—you know, do—are you concerned that something like that could potentially be a slippery slope to, you know, to consolidate Reserve Bank functions even more in such a way where you—you know, the central bank ultimately loses some of that important regional information?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So we try to be good stewards of the public's money, and efficient. And Chris, in particular—Chris Waller is particularly passionate about that. Of course, so are the Reserve—so are the presidents. And, you know, it's a question of how do you accomplish it. We, of course—and Chris said this in his speech—we, you know, we want 12 strong independent central banks with their own staffs and their own monetary policy views and all that. But, you know, there are things that are done in all 12 which could well be done at 1 much more efficiently and with cost savings. And so there's a back-and-forth going on on that. But everybody, everybody's on the same page. The other thing he touched on was the idea of removing Reserve Bank presidents from office over different, different views on monetary policy. And I would—I would just agree with him so strongly that that would be the beginning of the end of, of the Fed's ability to, to make monetary policy independently. If every Administration could come in and do that, you're just another cabinet agency at that point. So that's not something that I would support. Chris said the same thing."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Christine."},
  {"type": "line", "who": "Christine Romans", "k": "guest", "text": "Thanks, Chair Powell. Christine Romans, NBC News. I want to ask about legacy. When the history books are written, how do you think your stewardship at the Fed will be remembered for the past eight years?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, I'm going to just say that that's for—that's for someone else to say. I'll give you a mulligan on that."},
  {"type": "line", "who": "Christine Romans", "k": "guest", "text": "All right. I'm going to ask you about misbehaving inflation then. You talked about those four big shocks—supply shocks—over the past five years and inflation still misbehaving. What's your message to American families who feel like inflation has not been under control for them really since, since the COVID reopening?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "You know, we're committed to bring inflation back down to 2 percent and sustainably. That's our goal. And we will—we'll stick at it until that happens. We keep getting—these events keep happening which keep driving up costs. And, you know, the best thing we can do is to use our tools to guide inflation back down to 2 percent. I think trying to get there really quickly could be very costly in terms of job loss and things like that. But we try to get there over time in a way that does the least damage possible. And, you know, our commitment to that is never-ending and unshakable."},
  {"type": "line", "who": "Christine Romans", "k": "guest", "text": "How would you describe the economy outside of the misbehaving inflation? I mean, it's still awfully resilient, given all of the blows."},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I don't know that you can be \"awfully\" resilient—so it's actually quite resilient, I would say, because it's a positive thing, if I can—if I can have that amendment. Yeah, you know, growth is really solid across our economy. Some of that is that consumer spending is hanging in pretty well. The most recent data are good. And some of it is just the apparently insatiable demand for data centers all over the United States. So a lot of business investment going into building data centers, and every reason to think that that continues. So you've got an economy that's growing at 2 percent or better. PDFP, which is private domestic final purchases, which is really a better signal of, of momentum in the economy, is actually higher than that. So that's, you know, that's a positive thing. If you look at the unemployment rate, it's 4.3 [percent], so that's a low rate. That's pretty close to mainstream estimates of the natural rate. We've been there for a long time. So it's—it doesn't feel like a good labor market to some who don't have jobs because quits are really low, hires are really low, and there's effectively no new net job creation. So that's, that's—you know, in a sense, the labor market is in balance, but it's an unusual and uncomfortable kind of a balance where people who don't have jobs will have a hard time breaking in unless somebody quits their job. So that's pretty good. You know, inflation is the thing we need to work on. And it's partly tariffs, which we think—we think that that inflation should subside over the course of this year because it's kind of a one-time increase, it shouldn't be repeated. And that should start happening pretty soon. The energy inflation that we're getting should go through fairly quickly. And we'll just have to see how that works out. In the meantime, you know, we think our policy stance is in a good place for us to hold and wait developments."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Jennifer."},
  {"type": "line", "who": "Jennifer Schonberger", "k": "guest", "text": "Thank you, Chair Powell. Jennifer Schonberger with Yahoo Finance. At the risk of beating the dead horse here, clearly three members objected to keeping that easing bias in the statement. And you said that the majority still didn't need—still didn't need to move to new language at this point. So does the majority of the Committee still have a bias towards cuts at this point? Or has the bias on the Committee shifted away from cuts towards holding or hikes, if that was needed?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "So I think that, you know, the center is moving toward a more neutral place. And that's sort of what markets are saying, too. I just think, you know, there's a lot of signaling going on when you change guidance like that. And so we just—I guess a majority of us didn't feel like we needed to send a signal on that right now. And—but maybe it'll come to that. And the reason is because, you know, we're kind of waiting to see what happens with, with events in the Middle East and what are the implications of those events for the U.S. economy. So there was just a—there's a group who feels like we don't need to be in a hurry to do that. We get it. And, of course, we will move to a hiking bias if we want to hike, and we'll move to a neutral bias before that. But there was a difference over whether to do it at this meeting—at a meeting at which all but one of us agreed that the—that the rate decision was correct, which was not to move."},
  {"type": "line", "who": "Jennifer Schonberger", "k": "guest", "text": "And you just said moments ago that you believe Fed independence is at risk. Is it safe to say that you want to stay on as a Governor to serve as a check and balance on that?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "I want to stay until I—I will stay until it's—I feel it's appropriate for me to leave. And, yes, that is—that is really what is driving this. I'm not—I'm not looking to be, you know, a high-profile dissident or anything like that. I'm more looking at the other aspects of this and wanting to see that things have calmed down and are returning to a traditional model of working with the people that you have and bringing them to consensus and respecting that consensus. That's what—that's what I'm hoping to see."},
  {"type": "line", "who": "Michelle Smith", "k": "narrator", "text": "Matt Egan."},
  {"type": "line", "who": "Matt Egan", "k": "guest", "text": "Thanks, Chair Powell. Matt Egan with CNN. You've made many tough decisions in your time at the Fed. And as your time as Chair comes to a close and you think about your tenure and perhaps your legacy, are there any decisions that stand out as ones that you're particularly proud of? And are there any that, with the benefit of hindsight, you would take a mulligan on?"},
  {"type": "line", "who": "Chair Powell", "k": "host", "text": "Yeah, it's hard. I wouldn't want to single out individual things at this point. You know, I'll just say, you know, we—all of us together have consistently tried to do what we think is best for the American people based on our tools and our objectives that Congress has given us. It's been very challenging because we've been in a situation of supply shock—supply shocks, really, for six years. And that's just a very different situation than—for a very long time, what the Fed and other central banks were doing all the time was demand management. And, you know, and there was always the inflation mandate, but inflation was low for 25 years. So this is a very different world and a much more challenging one where you have to balance the two objectives. And, by the way, central banks that have an inflation mandate have to do exactly the same thing because they're balancing economic activity. So that's been challenging. And we've, you know, we've tried to do our very best through these really challenging times. And I'm really proud of the work that I've done, that my—that my colleagues and I have done during these, these years."},
  {"type": "line", "who": "Matt Egan", "k": "guest", "text": "Now, to follow up on some of the discussion around Fed independence, can you explain to the public why this notion of Fed independence, which might sound kind of wonky to some, is so critical? I mean, what are the consequences if either the Supreme Court rules against Lisa Cook or the Fed in the future decides to make decisions more around the political calendar instead of the economic data?"},
